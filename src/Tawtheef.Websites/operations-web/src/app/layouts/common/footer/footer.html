<footer class="main-footer">
  <div class="footer-container">
    <!-- Copyright -->
    <div class="copyright">
      <p>{{ 'internal.footer.ministry' | translate }}</p>
    </div>
    <!-- Social Media Icons -->
    <div class="social-links">
      <a href="https://tiktok.com" target="_blank" rel="noopener" aria-label="TikTok">
        <img src="../../../../assets/img/social-media/tiktok.svg" alt="TikTok"/>
      </a>
      <a href="https://snapchat.com" target="_blank" rel="noopener" aria-label="Snapchat">
        <img src="../../../../assets/img/social-media/snapchat.svg" alt="Snapchat"/>
      </a>
      <a href="https://linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn">
        <img src="../../../../assets/img/social-media/linkedin.svg" alt="LinkedIn"/>
      </a>
      <a href="https://youtube.com" target="_blank" rel="noopener" aria-label="YouTube">
        <img src="../../../../assets/img/social-media/youtube.svg" alt="YouTube"/>
      </a>
      <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram">
        <img src="../../../../assets/img/social-media/instagram.svg" alt="Instagram"/>
      </a>
      <a href="https://twitter.com" target="_blank" rel="noopener" aria-label="Twitter/X">
        <img src="../../../../assets/img/social-media/twitter-x.svg" alt="Twitter/X"/>
      </a>
    </div>
    <!-- Footer Links -->
    <div class="footer-links">
      <a [routerLink]="routes.privacy">{{'internal.footer.privacy' | translate}}</a>
      <span class="separator">|</span>
      <a [routerLink]="routes.terms">{{'internal.footer.terms' | translate}}</a>
    </div>
  </div>
</footer>
