<div class="app-layout" i18nNamespace="layout">
  <!-- Navigation -->
  <app-nav/>

  <!-- Main Content Area with Sidebar -->
  <div class="layout">
    <!-- Sidebar -->
    <app-sidebar
      (toggleSidebar)="toggleSidebar()"
      [class.closed]="!isSidebarOpen">
    </app-sidebar>

    <!-- Main Content -->
    <main class="main-content">
      <router-outlet />
    </main>
  </div>

  <!-- Footer -->
  <app-footer/>
</div>
