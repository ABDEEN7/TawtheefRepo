<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content">
    <div class="modal-body text-center custom-modal-body">
  <span class="avatar avatar-lg rounded-circle mb-2"
        [ngClass]="{
          'bg-danger-transparent': config.data.type === 'delete',
          'bg-primary-transparent': config.data.type === 'submit',
          'bg-warning-transparent': config.data.type === 'warning'
        }">
    <i class="isax fs-24"
       [ngClass]="{
         'isax-trash text-danger': config.data.type === 'delete',
         'isax-document-upload text-primary': config.data.type === 'submit',
         'isax-danger text-warning': config.data.type === 'warning'
      }"></i>
  </span>
      <div>
        <p class="mb-3">{{ config.data.description | translate: config.data.descriptionParams }}</p>

        <div class="form-group text-start mb-3" *ngIf="config.data.showInputField">
          <label class="form-label">{{ config.data.inputLabel | translate }}</label>
          <textarea class="form-control" rows="4"
                    [(ngModel)]="inputValue"
                    [attr.maxlength]="config.data.inputMaxLength || null"
                    [placeholder]="config.data.inputPlaceholder | translate"
                    *ngIf="config.data.inputType === 'textarea'"></textarea>
          <input class="form-control" type="text"
                 [(ngModel)]="inputValue"
                 [placeholder]="config.data.inputPlaceholder | translate"
                 *ngIf="config.data.inputType === 'text'">
        </div>

        <div class="d-flex align-items-center justify-content-center gap-2">
          <button class="btn rounded-pill" [ngClass]="{
            'btn-outline-secondary': config.data.primaryActionStyle === true,
            'bg-gray-100': config.data.primaryActionStyle !== true
          }" (click)="ref.close(false)">
            {{ (config.data.cancelText || 'common.cancel') | translate }}
          </button>
          <button class="btn rounded-pill"
                  (click)="onConfirm()"
                  [disabled]="isConfirmDisabled()"
                  [ngClass]="{
                'btn-danger': config.data.type === 'delete',
                'btn-primary': config.data.type === 'submit' || config.data.primaryActionStyle === true,
                'btn-warning': config.data.type === 'warning' && config.data.primaryActionStyle !== true
              }">
            {{ (config.data.confirmText || 'common.confirm') | translate }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
