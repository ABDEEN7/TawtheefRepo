<div class="file-viewer" [class.active]="!!url">
  <!-- Toolbar -->
  <div class="viewer-toolbar">
    <div class="toolbar-left">
      <h6 class="file-name" [pTooltip]="fileName" tooltipPosition="bottom">
        <i class="pi pi-file me-2"></i>
        <span>{{ fileName || 'file_viewer.no_title' | translate }}</span>
      </h6>
    </div>
    
    <div class="toolbar-center">
      <div class="zoom-controls">
        <button pButton icon="pi pi-minus" class="p-button-text p-button-sm rounded-circle" 
                (click)="zoomOut()" [pTooltip]="'file_viewer.zoom_out' | translate"></button>
        <span class="zoom-value">{{ zoomLevel() }}%</span>
        <button pButton icon="pi pi-plus" class="p-button-text p-button-sm rounded-circle" 
                (click)="zoomIn()" [pTooltip]="'file_viewer.zoom_in' | translate"></button>
        <button pButton icon="pi pi-refresh" class="p-button-text p-button-sm rounded-circle" 
                (click)="resetZoom()" [pTooltip]="'file_viewer.reset_zoom' | translate"></button>
      </div>
    </div>

    <div class="toolbar-right">
        <button pButton icon="pi pi-download" class="p-button-text p-button-sm rounded-circle" 
                (click)="download()" [pTooltip]="'file_viewer.download' | translate"></button>
      <button pButton icon="pi pi-times" class="p-button-text p-button-sm rounded-circle text-danger" 
              (click)="onClose()" [pTooltip]="'common.close' | translate"></button>
    </div>
  </div>

  <!-- Content Area -->
  <div class="viewer-content">
    <div class="viewer-loading" *ngIf="loading">
      <div class="loading-pulse">
        <img src="assets/img/logo.png" alt="Loading" class="ministry-logo">
      </div>
      <p class="mt-3 pulsate-text">{{ 'file_viewer.fetching' | translate }}</p>
    </div>

    <ng-container *ngIf="url && !loading; else noFile">
      <div class="zoom-wrapper" [style.transform]="'scale(' + zoomLevel()/100 + ')'" [style.transformOrigin]="'top center'">
          
        <!-- PDF Viewer -->
        <div *ngIf="isPdf" class="pdf-container">
          <iframe [src]="url | safeUrl" width="100%" height="100%" frameborder="0"></iframe>
        </div>

        <!-- Image Viewer -->
        <div *ngIf="isImage" class="image-container">
          <img [src]="url" [alt]="fileName" class="img-fluid rounded shadow-sm">
        </div>

        <!-- Text Viewer -->
        <div *ngIf="isText" class="text-container">
           <iframe [src]="url | safeUrl" width="100%" height="100%" frameborder="0"></iframe>
        </div>

        <!-- Fallback if not recognized -->
        <div *ngIf="!isPdf && !isImage && !isText" class="fallback-container p-5 text-center">
           <i class="pi pi-file fs-1 mb-3 text-muted"></i>
           <p class="text-muted">{{ 'file_viewer.unsupported_preview' | translate }}</p>
           <button pButton (click)="download()" icon="pi pi-download" [label]="'file_viewer.download' | translate"></button>
        </div>
      </div>
    </ng-container>

    <ng-template #noFile>
      <div class="empty-state d-flex flex-column align-items-center justify-content-center h-100 p-5" *ngIf="!loading">
        <div class="empty-icon shadow-sm mb-4">
           <i class="pi pi-file-o fs-1"></i>
        </div>
        <h5>{{ 'file_viewer.select_file' | translate }}</h5>
        <p class="text-muted text-center">{{ 'file_viewer.select_hint' | translate }}</p>
      </div>
    </ng-template>
  </div>
</div>
