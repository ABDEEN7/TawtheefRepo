<div class="progress-container" [class.is-visible]="visible">
  <div class="progress-line" [style.width.%]="progressValue"></div>
</div>

<!-- Full-screen overlay -->
<div class="loading-overlay" [class.is-visible]="visible" aria-hidden="true">
  <div class="loading-content">
    <img src="assets/img/loading-indicator.svg" alt="" />
  </div>
</div>
