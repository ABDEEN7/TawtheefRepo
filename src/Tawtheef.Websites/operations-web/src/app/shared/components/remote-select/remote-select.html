<div class="select-with-loading">
  <p-select [options]="options()" [filter]="true"
    [optionLabel]="optionLabel" [optionValue]="optionValue" [placeholder]="computedPlaceholder"
    [disabled]="isDisabledComputed" (onFilter)="onFilter($event)" (onLazyLoad)="onLazyLoad($event)" (onShow)="onOpen()"
    (onHide)="onClose()" (onChange)="handleChange($event)" (onClear)="onClearSelection()" [ngModel]="value()"
    [emptyMessage]="emptyMessage()" [size]="size" [appendTo]="appendTo" [panelStyle]="panelStyle"
    [showClear]="showClear" [virtualScroll]="true" [virtualScrollItemSize]="virtualScrollItemSize" [lazy]="true"
    [class]="invalid ? 'p-invalid' : 'panelStyle'">
    <ng-template pTemplate="item" let-option>
      <div class="remote-select-option" [title]="getOptionLabelValue(option)">
        <span class="text-truncate">{{ getOptionLabelValue(option) }}</span>
        @if (getSecondaryOptionLabelValue(option); as secondaryLabel) {
          <small class="remote-select-option__secondary text-truncate">{{ secondaryLabel }}</small>
        }
      </div>
    </ng-template>
  </p-select>

  @if (isLoading()) {
  <div class="select-loading-overlay">
    <div class="spinner"></div>
  </div>
  }
</div>
