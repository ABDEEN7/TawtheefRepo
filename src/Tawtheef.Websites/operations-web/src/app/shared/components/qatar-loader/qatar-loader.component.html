@if (loading()) {
  <div class="qatar-loader-backdrop">
    <div class="qatar-loader-card">
      <div class="qatar-loader-logo" aria-hidden="true">
        <div class="orbit orbit-1"></div>
        <div class="orbit orbit-2"></div>
        <div class="center-gem"></div>
        <div class="pulse-dot"></div>
      </div>
      <div class="loader-text">{{ 'common.loading' | translate }}</div>
    </div>
  </div>
}
