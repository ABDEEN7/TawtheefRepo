@if (statusBackendName === pendingApprovalStatus) {
  <section *hasPermission="workflowPermission" class="mt-4">
    <div class="card card-table">
      <div class="card-body">
        <div class="exam-workflow-actions">
          <div class="exam-workflow-actions__reject">
            <button
              pButton
              type="button"
              severity="danger"
              [outlined]="true"
              [disabled]="submitting"
              (click)="rejectClicked.emit()"
            >
              <span pButtonLabel>{{ 'EXAMS.REJECT' | translate }}</span>
              <i class="fa-solid fa-xmark" pButtonIcon></i>
            </button>
          </div>
          <div class="d-flex gap-2 flex-wrap exam-workflow-actions__main">
            <button
              pButton
              type="button"
              severity="warn"
              [outlined]="true"
              [disabled]="submitting"
              (click)="returnClicked.emit()"
            >
              <span pButtonLabel>{{ 'EXAMS.RETURN' | translate }}</span>
              <i class="fa-solid fa-rotate-left" pButtonIcon></i>
            </button>

            <button pButton type="button" [disabled]="submitting" (click)="approveClicked.emit()">
              <span pButtonLabel>{{ 'EXAMS.APPROVE' | translate }}</span>
              <i class="fa-solid fa-check" pButtonIcon></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>
}
