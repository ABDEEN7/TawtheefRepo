<section i18nNamespace="pages/job-candidates" class="jc-dialog">
  <div class="jc-dialog__body">
    <!-- Header with Add button -->
    <div class="d-flex justify-content-between align-items-center mb-4 px-2">
      <h5 class="fw-bold text-primary-dark mb-0">الجنسية والنسب المفضلة</h5>
      <button class="btn btn-primary d-flex align-items-center gap-2 px-3" type="button" (click)="addBreakdown()">
        <i class="hgi hgi-stroke hgi-add-01"></i>
        <span>{{ 'JOB_CANDIDATE_FILTERS_ADD_NATIONALITY' | translate }}</span>
      </button>
    </div>

    <form [formGroup]="form">
      <div formArrayName="breakdowns" class="vstack gap-2">
        <div *ngFor="let group of breakdownControls.controls; let i = index" [formGroupName]="i"
          class="jc-row p-3 rounded-3 border bg-white">
          <div class="row g-3 align-items-center">
            <!-- Nationality Selection -->
            <div class="col-12 col-lg-6">
              <label class="form-label fs-13 text-muted fw-semibold mb-1 small">{{ 'JOB_CANDIDATE_FILTERS_NATIONALITY' | translate
                }}</label>
              <p-select class="w-100" [options]="lookupsService.nationalities()" optionLabel="name" optionValue="id"
                formControlName="nationalityId" [showClear]="true" [filter]="true"
                filterBy="additionalData.nameAr,additionalData.nameEn,name"
                [placeholder]="'JOB_CANDIDATE_FILTERS_NATIONALITY' | translate"></p-select>
            </div>

            <!-- Percentage Control -->
            <div class="col-12 col-lg-5">
              <label class="form-label fs-13 text-muted fw-semibold mb-1 small">{{ 'JOB_CANDIDATE_FILTERS_PERCENTAGE_VALUE' |
                translate }}</label>
              <div class="points-control">
                <p-inputNumber formControlName="percentage" [min]="0" [max]="100" [showButtons]="false"
                  [placeholder]="'0'" class="points-input"></p-inputNumber>
                <span class="px-3 fw-bold text-muted">%</span>
              </div>
            </div>

            <!-- Delete Action -->
            <div class="col-12 col-lg-1 text-end mt-lg-4">
              <button class="btn btn-action-icon text-danger" type="button" (click)="removeBreakdown(i)"
                pTooltip="{{ 'common.delete' | translate }}" tooltipPosition="top">
                <i class="hgi hgi-stroke hgi-delete-02 fs-20"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- Footer actions -->
  <div class="jc-dialog__footer border-top bg-light d-flex justify-content-end gap-2">
    <button class="btn btn-link text-decoration-none text-muted fw-semibold" type="button" (click)="close()">
      {{ 'common.cancel' | translate }}
    </button>
    <button class="btn btn-primary px-4 fw-bold d-flex align-items-center gap-2" type="button" (click)="save()">
      <i class="hgi hgi-stroke hgi-floppy-disk fs-18"></i>
      {{ 'common.save' | translate }}
    </button>
  </div>
</section>
