<div class="d-flex flex-column gap-3 p-2">
  <p class="text-muted mb-0">
    {{ 'INTERVIEW_SCHEDULE.WIZARD.REASSIGN_FOR' | translate }} <strong>{{ candidateName }}</strong>
  </p>

  <app-slot-picker
    [slots]="openSlots"
    [current]="current"
    [isRtl]="isRtl"
    [(selectedId)]="selectedSlotStartAt"
  />

  <div class="d-flex justify-content-end gap-2">
    <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
      {{ 'INTERVIEW_SCHEDULE.WIZARD.CANCEL' | translate }}
    </button>
    <button type="button" class="btn btn-primary" [disabled]="openSlots.length === 0" (click)="save()">
      {{ 'INTERVIEW_SCHEDULE.WIZARD.SAVE' | translate }}
    </button>
  </div>
</div>
