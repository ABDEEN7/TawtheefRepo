<div class="row g-3">
  <div class="col-12 col-lg-6">
    <p-card class="shadow-sm h-100 section-panel">
      <ng-template pTemplate="header">
        <div class="card-head">
          <span class="icon-circle text-primary bg-light">
            <i class="pi pi-star"></i>
          </span>
          <span class="fw-bold">{{ 'profileApproval.detail.skills.title' | translate }}</span>
        </div>
      </ng-template>

      <div class="chip-stack" *ngIf="skills?.length; else emptySkills">
        <div class="chip-row" *ngFor="let s of skills">
          <div class="chip-title">{{ displayOption(s.skill, s.skillId) }}</div>
          <p-tag *ngIf="s.level || s.levelId" severity="info" [value]="displayOption(s.level, s.levelId)"></p-tag>
          <p-tag *ngIf="s.isRequired !== undefined" [severity]="s.isRequired ? 'danger' : 'secondary'"
            [value]="(s.isRequired ? 'JOB_WIZARD.STEPS.SKILLS.REQUIRED' : 'JOB_WIZARD.STEPS.SKILLS.OPTIONAL') | translate"></p-tag>
        </div>
      </div>
    </p-card>
  </div>

  <ng-template #emptySkills>
    <div class="empty-block">{{ 'profileApproval.detail.snapshot.noEntries' | translate }}</div>
  </ng-template>
</div>
