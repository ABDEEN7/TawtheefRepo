<div class="d-flex flex-column gap-3 p-2">
  <div class="row g-3">
    <div class="col-12">
      <label class="form-label">{{ 'INTERVIEW_SCHEDULE.WIZARD.PERIOD_DATE' | translate }}</label>
      <p-datepicker [(ngModel)]="date" appendTo="body" dateFormat="dd/mm/yy" class="w-100" [minDate]="minDate"
        [placeholder]="'INTERVIEW_SCHEDULE.WIZARD.PERIOD_DATE' | translate"></p-datepicker>
    </div>

    <div class="col-6">
      <label class="form-label">{{ 'INTERVIEW_SCHEDULE.WIZARD.PERIOD_START_TIME' | translate }}</label>
      <p-datepicker [(ngModel)]="startTime" appendTo="body" [timeOnly]="true" hourFormat="24" class="w-100"></p-datepicker>
    </div>
    <div class="col-6">
      <label class="form-label">{{ 'INTERVIEW_SCHEDULE.WIZARD.PERIOD_END_TIME' | translate }}</label>
      <p-datepicker [(ngModel)]="endTime" appendTo="body" [timeOnly]="true" hourFormat="24" class="w-100"
        [minDate]="startTime ?? undefined"></p-datepicker>
    </div>
    @if (endBeforeStart) {
      <div class="col-12">
        <small class="text-danger">{{ 'INTERVIEW_SCHEDULE.VALIDATION.PERIOD_END_AFTER_START' | translate }}</small>
      </div>
    }

    @if (interviewType === InterviewType.InPerson) {
      <div class="col-12">
        <label class="form-label">{{ 'INTERVIEW_SCHEDULE.WIZARD.PERIOD_ROOM' | translate }}</label>
        <app-lazy-select
          [search]="searchRooms"
          [selected]="room"
          [placeholder]="'INTERVIEW_SCHEDULE.WIZARD.PERIOD_ROOM_PLACEHOLDER' | translate"
          [showClear]="true"
          (selectedChange)="onRoomSelected($event)"
        />
      </div>
    } @else {
      <div class="col-12">
        <label class="form-label">{{ 'INTERVIEW_SCHEDULE.WIZARD.PERIOD_REMOTE_URL' | translate }}</label>
        <input type="text" pInputText class="w-100" [(ngModel)]="remoteMeetingUrl"
          [placeholder]="'INTERVIEW_SCHEDULE.WIZARD.PERIOD_REMOTE_URL_PLACEHOLDER' | translate" />
      </div>
      <div class="col-12">
        <label class="form-label">{{ 'INTERVIEW_SCHEDULE.WIZARD.PERIOD_REMOTE_INSTRUCTIONS' | translate }}</label>
        <input type="text" pInputText class="w-100" [(ngModel)]="remoteMeetingInstructions"
          [placeholder]="'INTERVIEW_SCHEDULE.WIZARD.PERIOD_REMOTE_INSTRUCTIONS_PLACEHOLDER' | translate" />
      </div>
    }
  </div>

  <div class="d-flex justify-content-end gap-2 mt-2">
    <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
      {{ 'INTERVIEW_SCHEDULE.WIZARD.CANCEL' | translate }}
    </button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="endBeforeStart">
      {{ 'INTERVIEW_SCHEDULE.WIZARD.SAVE' | translate }}
    </button>
  </div>
</div>
