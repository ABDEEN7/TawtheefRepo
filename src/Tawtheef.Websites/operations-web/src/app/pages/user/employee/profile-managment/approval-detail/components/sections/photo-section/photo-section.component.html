<p-card class="shadow-sm photo-card section-panel text-center">
  <ng-template pTemplate="header">
    <div class="card-head justify-content-center">
      <span class="icon-circle text-primary bg-light">
        <i class="pi pi-image"></i>
      </span>
      <span class="fw-bold">{{ 'profileApproval.sections.profilePhoto' | translate }}</span>
    </div>
  </ng-template>

  <div class="photo-frame">
    <img [src]="profilePhoto || 'assets/img/avatar.png'" alt="profile-photo" class="img-fluid rounded" />
  </div>
</p-card>
