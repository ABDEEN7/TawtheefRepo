<!-- majors-skills-management.page.html -->
<div class="management-page" i18nNamespace="pages/employee/majors-skills-management" [attr.dir]="store.isRtl() ? 'rtl' : 'ltr'">
  <div class="card shadow-sm p-3 mb-4 tab-card">
    <div class="d-flex flex-wrap gap-2">
      <button class="btn tab-btn" [class.active]="store.activeTab() === 'mapping'" (click)="service.switchTab('mapping')">
        {{ 'MAJORS_SKILLS.MAJOR_SKILL_TAB' | translate }}
      </button>
      <button class="btn tab-btn" [class.active]="store.activeTab() === 'mainMajors'" (click)="service.switchTab('mainMajors')">
        {{ 'MAJORS_SKILLS.MAIN_MAJORS_TAB' | translate }}
      </button>
      <button class="btn tab-btn" [class.active]="store.activeTab() === 'subMajors'" (click)="service.switchTab('subMajors')">
        {{ 'MAJORS_SKILLS.SUB_MAJORS_TAB' | translate }}
      </button>
      <button class="btn tab-btn" [class.active]="store.activeTab() === 'skills'" (click)="service.switchTab('skills')">
        {{ 'MAJORS_SKILLS.SKILLS_TAB' | translate }}
      </button>
    </div>
  </div>

  @if (store.activeTab() === 'mapping') {
    <app-mapping-tab />
  }
  @if (store.activeTab() === 'mainMajors') {
    <app-main-majors-tab />
  }
  @if (store.activeTab() === 'subMajors') {
    <app-sub-majors-tab />
  }
  @if (store.activeTab() === 'skills') {
    <app-skills-tab />
  }
  <p-confirmDialog></p-confirmDialog>
</div>
