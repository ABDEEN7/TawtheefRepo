<div class="specialization-filter-container p-3" i18nNamespace="pages/job-candidates">
  <div class="mb-4">
    <p class="text-muted fs-14 mb-3">
      {{ 'JOB_CANDIDATE_SPECIALIZATION_FILTER_DESCRIPTION' | translate }}
    </p>

    <div [formGroup]="form">
      <div formArrayName="specializationSelections" class="specialization-list">
        @for (spec of specializationSelections.controls; track spec; let i = $index) {
        <div [formGroupName]="i" class="specialization-item card mb-2 border-light shadow-sm"
          [class.main-specialization]="spec.get('isMain')?.value" [class.selected]="spec.get('isSelected')?.value">
          <div class="card-body p-3 d-flex align-items-center">
            <p-checkbox formControlName="isSelected" [binary]="true" [disabled]="spec.get('isMain')?.value"></p-checkbox>
            <div class="ms-3 flex-grow-1">
              <div class="d-flex align-items-center gap-2">
                <span class="fw-bold">{{ spec.get('label')?.value }}</span>
                @if (spec.get('isMain')?.value) {
                <span class="badge bg-primary bg-opacity-10 text-primary border-0 fs-10">
                  {{ 'JOB_CANDIDATE_MAIN_SPECIALIZATION' | translate }}
                </span>
                }
              </div>
            </div>
          </div>
        </div>
        }
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
    <button class="btn btn-outline-secondary" (click)="close()">
      {{ 'common.cancel' | translate }}
    </button>
    <button class="btn btn-primary" (click)="save()">
      {{ 'common.apply' | translate }}
    </button>
  </div>
</div>
