<div i18nNamespace="pages/employee/interview-schedule" [attr.dir]="store.isRtl() ? 'rtl' : 'ltr'">
  @if (store.view() === 'list') {
    <app-schedules-list />
  }
  @if (store.view() === 'wizard') {
    <app-schedule-wizard />
  }
  @if (store.view() === 'detail') {
    <app-schedule-detail />
  }
</div>
