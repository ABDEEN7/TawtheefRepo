<section i18nNamespace="pages/job-candidates" class="jc-dialog">
  <div class="jc-dialog__body">
    <form [formGroup]="form" class="mt-1">
      <div formArrayName="percentages" class="vstack gap-2">
        <div *ngFor="let group of percentageControls.controls; let i = index" [formGroupName]="i" 
             class="jc-row p-3 rounded-3 border bg-white">
          <div class="row g-3 align-items-center">
            <!-- Label -->
            <div class="col-12 col-lg-5">
              <div class="fw-bold text-primary-dark fs-15">
                {{ getCandidateTypeName(group.get('candidateTypeId')?.value) }}
              </div>
            </div>

            <!-- Percentage Control -->
            <div class="col-12 col-lg-4">
              <div class="points-control">
                <span class="points-chip">{{ 'JOB_CANDIDATE_FILTERS_PERCENTAGE_VALUE' | translate }}</span>
                <p-inputNumber formControlName="percentage" [min]="0" [max]="100" [showButtons]="false"
                  [placeholder]="'0'"
                  class="points-input"></p-inputNumber>
                <span class="pe-3 fw-bold text-muted">%</span>
              </div>
            </div>

            <!-- Breakdown button -->
            <div class="col-12 col-lg-3">
              @if (hasNationalityBreakdown(group.get('candidateTypeId')?.value)) {
              <button class="btn btn-outline-primary btn-sm w-100 py-2 d-flex align-items-center justify-content-center gap-2" 
                type="button"
                (click)="openNationalityBreakdown(group.get('candidateTypeId')?.value)">
                <i class="hgi hgi-stroke hgi-structure-02 fs-14"></i>
                <span class="fs-13">{{ 'JOB_CANDIDATE_FILTERS_NATIONALITY_BREAKDOWN' | translate }}</span>
                <span class="badge rounded-pill bg-primary bg-opacity-10 text-primary fw-bold">
                   {{ getNationalityBreakdownCount(group.get('candidateTypeId')?.value) }}
                </span>
              </button>
              }
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- Footer actions -->
  <div class="jc-dialog__footer border-top bg-light d-flex justify-content-end gap-2">
    <button class="btn btn-link text-decoration-none text-muted fw-semibold" type="button" (click)="close()">
      {{ 'common.cancel' | translate }}
    </button>
    <button class="btn btn-primary px-4 fw-bold d-flex align-items-center gap-2" type="button" (click)="save()">
      <i class="hgi hgi-stroke hgi-tick-01 fs-18"></i>
      {{ 'common.apply' | translate }}
    </button>
  </div>
</section>
