<div class="d-flex flex-column gap-3 p-2">
  <p class="text-muted mb-0">
    {{ 'INTERVIEW_SCHEDULE.DETAIL.RESCHEDULE_FOR' | translate }} <strong>{{ candidateName }}</strong>
  </p>

  <div class="row g-3">
    <div class="col-6">
      <label class="form-label">{{ 'INTERVIEW_SCHEDULE.WIZARD.PERIOD_START_TIME' | translate }}</label>
      <p-datepicker [(ngModel)]="startAt" appendTo="body" [showTime]="true" hourFormat="24"
        dateFormat="dd/mm/yy" class="w-100" [minDate]="minDate"></p-datepicker>
    </div>
    <div class="col-6">
      <label class="form-label">{{ 'INTERVIEW_SCHEDULE.WIZARD.PERIOD_END_TIME' | translate }}</label>
      <p-datepicker [(ngModel)]="endAt" appendTo="body" [showTime]="true" hourFormat="24"
        dateFormat="dd/mm/yy" class="w-100" [minDate]="startAt ?? minDate"></p-datepicker>
    </div>

    @if (interviewType === InterviewType.InPerson) {
      <div class="col-12">
        <label class="form-label">{{ 'INTERVIEW_SCHEDULE.WIZARD.PERIOD_ROOM' | translate }}</label>
        <app-lazy-select
          [search]="searchRooms"
          [selected]="room"
          [placeholder]="'INTERVIEW_SCHEDULE.WIZARD.PERIOD_ROOM_PLACEHOLDER' | translate"
          [showClear]="true"
          (selectedChange)="onRoomSelected($event)"
        />
      </div>
    } @else {
      <div class="col-12">
        <label class="form-label">{{ 'INTERVIEW_SCHEDULE.WIZARD.PERIOD_REMOTE_URL' | translate }}</label>
        <input type="text" pInputText class="w-100" [(ngModel)]="remoteMeetingUrl" />
      </div>
    }

    <div class="col-12">
      <label class="form-label">{{ 'INTERVIEW_SCHEDULE.DETAIL.REASON_LABEL' | translate }}</label>
      <textarea pTextarea rows="3" class="w-100" [(ngModel)]="reason"
        [placeholder]="'INTERVIEW_SCHEDULE.DETAIL.REASON_PLACEHOLDER' | translate"></textarea>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-2">
    <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
      {{ 'INTERVIEW_SCHEDULE.WIZARD.CANCEL' | translate }}
    </button>
    <button type="button" class="btn btn-primary" (click)="save()">
      {{ 'INTERVIEW_SCHEDULE.DETAIL.RESCHEDULE' | translate }}
    </button>
  </div>
</div>
