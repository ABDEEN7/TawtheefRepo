<div class="d-flex flex-column gap-3 p-2">
  <p class="text-muted mb-0">
    {{ 'INTERVIEW_SCHEDULE.DETAIL.RESCHEDULE_FOR' | translate }}
    <strong>{{ candidateName }}</strong>
  </p>

  <app-slot-picker
    [slots]="pickerSlots()"
    [current]="current"
    [isRtl]="isRtl"
    [status]="loadState()"
    [(selectedId)]="selectedSlotId"
    (retry)="load()"
  />

  <div>
    <label class="form-label" for="reschedule-reason">{{ 'INTERVIEW_SCHEDULE.DETAIL.REASON_LABEL' | translate }}</label>
    <textarea
      id="reschedule-reason"
      pTextarea
      rows="3"
      class="w-100"
      [(ngModel)]="reason"
      [placeholder]="'INTERVIEW_SCHEDULE.DETAIL.REASON_PLACEHOLDER' | translate"
    ></textarea>
  </div>

  <div class="d-flex justify-content-end gap-2">
    <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
      {{ 'INTERVIEW_SCHEDULE.WIZARD.CANCEL' | translate }}
    </button>
    <button
      type="button"
      class="btn btn-primary"
      [disabled]="loadState() !== 'ready' || pickerSlots().length === 0"
      (click)="save()"
    >
      {{ 'INTERVIEW_SCHEDULE.DETAIL.RESCHEDULE' | translate }}
    </button>
  </div>
</div>
