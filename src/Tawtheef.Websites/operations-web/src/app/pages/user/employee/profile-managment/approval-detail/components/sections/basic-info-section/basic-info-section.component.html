<div class="row g-3">
  <div class="col-12">
    <p-card class="shadow-sm h-100 section-panel">
      <ng-template pTemplate="header">
        <div class="card-head">
          <span class="icon-circle text-primary bg-light">
            <i class="pi pi-id-card"></i>
          </span>
          <div class="d-flex flex-column">
            <span class="fw-bold">{{ 'profileApproval.detail.snapshot.title' | translate }}</span>
            <small class="text-muted">{{ 'profileApproval.detail.snapshot.subtitle' | translate }}</small>
          </div>
        </div>
      </ng-template>

      <div class="info-grid" *ngIf="basicFields().length > 0; else emptyFields">
        <div class="info-chip" *ngFor="let field of basicFields()">
          <div class="chip-label">{{ field.label | translate }}</div>
          <div class="chip-value">
            <span>{{ field.value }}</span>
          </div>
        </div>
      </div>
      <ng-template #emptyFields>
        <div class="empty-block">{{ 'profileApproval.detail.snapshot.noEntries' | translate }}</div>
      </ng-template>
    </p-card>
  </div>

  <div class="col-12 col-lg-4" *ngIf="hasBasicFiles()">
    <p-card class="shadow-sm h-100 section-panel">
      <ng-template pTemplate="header">
        <div class="card-head">
          <span class="icon-circle text-primary bg-light">
            <i class="pi pi-paperclip"></i>
          </span>
          <span class="fw-bold">{{ 'profileApproval.detail.snapshot.files' | translate }}</span>
        </div>
      </ng-template>

      <div class="file-stack">
        <button
          type="button"
          class="file-chip"
          *ngIf="profile.basicInformation.nationalCard"
          pButton
          pRipple
          [label]="
            ('profileApproval.detail.snapshot.nationalCard' | translate) +
            ': ' +
            (profile.basicInformation.nationalCard.fileName || '-')
          "
          (click)="preview(profile.basicInformation.nationalCard.url)"
          icon="pi pi-external-link"
          iconPos="right"
        ></button>

        <button
          type="button"
          class="file-chip"
          *ngIf="profile.basicInformation.sponsorCard"
          pButton
          pRipple
          [label]="
            ('profileApproval.detail.snapshot.sponsorCard' | translate) +
            ': ' +
            (profile.basicInformation.sponsorCard.fileName || '-')
          "
          (click)="preview(profile.basicInformation.sponsorCard.url)"
          icon="pi pi-external-link"
          iconPos="right"
        ></button>
        <button
          type="button"
          class="file-chip"
          *ngIf="profile.basicInformation.resumeAttachment"
          pButton
          pRipple
          [label]="
            ('profileApproval.detail.snapshot.resumeAttachment' | translate) +
            ': ' +
            (profile.basicInformation.resumeAttachment.fileName || '-')
          "
          (click)="preview(profile.basicInformation.resumeAttachment.url)"
          icon="pi pi-external-link"
          iconPos="right"
        ></button>

      </div>
    </p-card>
  </div>
</div>
