<div class="row g-3">
  <div class="col-12">
    <p-card class="shadow-sm h-100 section-panel">
      <ng-template pTemplate="header">
        <div class="card-head">
          <span class="icon-circle text-primary bg-light">
            <i class="pi pi-id-card"></i>
          </span>
          <div class="d-flex flex-column">
            <span class="fw-bold">{{ 'profileApproval.detail.snapshot.title' | translate }}</span>
            <small class="text-muted">{{ 'profileApproval.detail.snapshot.subtitle' | translate }}</small>
          </div>
        </div>
      </ng-template>

      <div class="info-grid" *ngIf="basicFields().length > 0; else emptyFields">
        <div class="info-chip" *ngFor="let field of basicFields()">
          <div class="chip-label">{{ field.label | translate }}</div>
          <div class="chip-value">
            <span>{{ field.value }}</span>
          </div>
        </div>
      </div>
      <ng-template #emptyFields>
        <div class="empty-block">{{ 'profileApproval.detail.snapshot.noEntries' | translate }}</div>
      </ng-template>
    </p-card>
  </div>

  <div class="col-12 col-lg-4" *ngIf="hasBasicFiles()">
    <p-card class="shadow-sm h-100 section-panel">
      <ng-template pTemplate="header">
        <div class="card-head">
          <span class="icon-circle text-primary bg-light">
            <i class="pi pi-paperclip"></i>
          </span>
          <span class="fw-bold">{{ 'profileApproval.detail.snapshot.files' | translate }}</span>
        </div>
      </ng-template>

      <div class="file-stack">
        <ng-container *ngIf="profile.basicInformation.sponsorCard as sponsorCard">
          <div class="file-entry">
            <button
              type="button"
              class="file-chip"
              pButton
              pRipple
              [label]="
                ('profileApproval.detail.snapshot.sponsorCard' | translate) +
                ': ' +
                (sponsorCard.fileName || '-')
              "
              [pTooltip]="('profileApproval.detail.snapshot.sponsorCard' | translate) + ': ' + (sponsorCard.fileName || '-')"
              tooltipPosition="top"
              (click)="preview(sponsorCard.url, sponsorCard.fileName)"
              icon="pi pi-external-link"
              iconPos="right"
            ></button>
            <app-item-inline-review
              *ngIf="reviewItemFor(sponsorCard.resourceId) as review"
              [reviewItemId]="review.reviewItemId"
              [status]="review.status"
              [note]="review.note"
              (review)="reviewItem.emit($event)"
            ></app-item-inline-review>
          </div>
        </ng-container>
      </div>
    </p-card>
  </div>
</div>
