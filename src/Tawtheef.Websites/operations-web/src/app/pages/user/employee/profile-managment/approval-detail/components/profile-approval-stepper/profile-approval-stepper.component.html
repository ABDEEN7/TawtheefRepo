<div class="stepper-wrap" role="navigation" aria-label="Profile approval stepper">
  <div class="stepper">
    <button
      type="button"
      *ngFor="let s of sections; let i = index; trackBy: trackBySection"
      [ngClass]="stepClass(s, i)"
      (click)="onStepClick(s, i)"
      [attr.aria-current]="isStepActive(s) ? 'step' : null"
      [attr.aria-disabled]="isStepDisabled(s, i)"
      [disabled]="isStepDisabled(s, i)"
      pTooltip="{{ tooltipText(s) }}"
      tooltipPosition="top"
    >
      <span class="chip">
        <span class="badge" *ngIf="showIndex">{{ i + 1 }}</span>

        <i class="pi" [ngClass]="s.icon || 'pi pi-circle'" aria-hidden="true"></i>

        <span class="dot" *ngIf="!showIndex"></span>
      </span>

      <span class="label">
        {{ s.labelKey | translate }}
      </span>

      <span class="state-icon" aria-hidden="true">
        <i class="pi pi-check-circle" *ngIf="s.uiStatus === 'done'"></i>
        <i class="pi pi-flag-fill" *ngIf="s.uiStatus === 'bad'"></i>
        <i class="pi pi-angle-right" *ngIf="s.uiStatus === 'progress'"></i>
      </span>
    </button>
  </div>
</div>
