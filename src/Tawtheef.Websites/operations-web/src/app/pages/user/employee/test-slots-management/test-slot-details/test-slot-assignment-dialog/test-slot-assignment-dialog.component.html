@if (loading()) {
  <p class="mb-0">{{ 'TEST_SLOT_DETAILS.LOADING_ASSIGNMENTS' | translate }}</p>
} @else if (loadFailed()) {
  <div class="alert alert-danger mb-0">{{ 'TEST_SLOT_DETAILS.LOAD_ASSIGNMENTS_ERROR' | translate }}</div>
} @else {
  <app-test-slot-team-assignment-selector
    [selectedRoomHead]="roomHead()"
    [selectedTeamMembers]="teamMembers()"
    [showRoomHeadError]="showRoomHeadError()"
    (assignmentChange)="updateAssignment($event)"
  />
  <div class="d-flex justify-content-end gap-2 mt-4">
    <button type="button" class="btn btn-outline-primary" (click)="cancel()" [disabled]="saving()">
      {{ 'TEST_SLOT_WIZARD.CANCEL' | translate }}
    </button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="saving()">
      {{ 'TEST_SLOT_DETAILS.SAVE_ASSIGNMENTS' | translate }}
    </button>
  </div>
}
