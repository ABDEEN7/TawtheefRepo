<div class="row g-4">
  <div class="col-lg-6 col-md-6">
    <p-card class="shadow-sm h-100 section-panel">
      <ng-template pTemplate="header">
        <div class="card-head">
          <span class="icon-circle text-primary bg-light">
            <i class="pi pi-id-card"></i>
          </span>
          <div class="d-flex flex-column">
            <span class="fw-bold">{{ 'profileApproval.detail.snapshot.title' | translate }}</span>
            <small class="text-muted">{{ 'profileApproval.detail.snapshot.subtitle' | translate }}</small>
          </div>
        </div>
      </ng-template>

      <div class="info-grid" *ngIf="firstInfoFields().length > 0; else emptyFirstInfo">
        <div class="info-chip" *ngFor="let field of firstInfoFields()">
          <div class="chip-label">{{ field.label | translate }}</div>
          <div class="chip-value">
            <span>{{ field.value }}</span>
          </div>
        </div>
      </div>
      <ng-template #emptyFirstInfo>
        <div class="empty-block">{{ 'profileApproval.detail.snapshot.noEntries' | translate }}</div>
      </ng-template>
    </p-card>
  </div>

  <div class="col-lg-6 col-md-6" *ngIf="hasBasicFiles()">
    <p-card class="shadow-sm h-100 section-panel">
      <ng-template pTemplate="header">
        <div class="card-head">
          <span class="icon-circle text-primary bg-light">
            <i class="pi pi-paperclip"></i>
          </span>
          <span class="fw-bold">{{ 'profileApproval.detail.snapshot.files' | translate }}</span>
        </div>
      </ng-template>

      <div class="file-stack">
        <ng-container *ngIf="profile.basicInformation.nationalCard as nationalCard">
          <div class="file-entry">
            <button type="button" class="file-chip" pButton pRipple [label]="
                ('profileApproval.detail.snapshot.nationalCard' | translate) +
                ': ' +
                (nationalCard.fileName || '-')
              " (click)="preview(nationalCard.url, nationalCard.fileName)"
              [pTooltip]="('profileApproval.detail.snapshot.nationalCard' | translate) + ': ' + (nationalCard.fileName || '-')"
              tooltipPosition="top" icon="pi pi-external-link" iconPos="right"></button>
            <app-item-inline-review *ngIf="reviewItemFor(nationalCard.resourceId) as review"
              [reviewItemId]="review.reviewItemId" [status]="review.status" [note]="review.note"
              (review)="reviewItem.emit($event)"></app-item-inline-review>
          </div>
        </ng-container>

        <ng-container *ngIf="profile.basicInformation.resumeAttachment as resume">
          <div class="file-entry">
            <button type="button" class="file-chip" pButton pRipple [label]="
                ('profileApproval.detail.snapshot.resumeAttachment' | translate) +
                ': ' +
                (resume.fileName || '-')
              " (click)="preview(resume.url, resume.fileName)"
              [pTooltip]="('profileApproval.detail.snapshot.resumeAttachment' | translate) + ': ' + (resume.fileName || '-')"
              tooltipPosition="top" icon="pi pi-external-link" iconPos="right"></button>
            <app-item-inline-review *ngIf="reviewItemFor(resume.resourceId) as review"
              [reviewItemId]="review.reviewItemId" [status]="review.status" [note]="review.note"
              (review)="reviewItem.emit($event)"></app-item-inline-review>
          </div>
        </ng-container>
        <ng-container *ngIf="profile.basicInformation.birthdayCertificate as birthdayCertificate">
          <div class="file-entry">
            <button type="button" class="file-chip" pButton pRipple [label]="
                ('profileApproval.detail.snapshot.birthdayCertificate' | translate) +
                ': ' +
                (birthdayCertificate.fileName || '-')
              " (click)="preview(birthdayCertificate.url, birthdayCertificate.fileName)"
              [pTooltip]="('profileApproval.detail.snapshot.birthdayCertificate' | translate) + ': ' + (birthdayCertificate.fileName || '-')"
              tooltipPosition="top" icon="pi pi-external-link" iconPos="right"></button>
            <app-item-inline-review *ngIf="reviewItemFor(birthdayCertificate.resourceId) as review"
              [reviewItemId]="review.reviewItemId" [status]="review.status" [note]="review.note"
              (review)="reviewItem.emit($event)"></app-item-inline-review>
          </div>
        </ng-container>
        <ng-container *ngIf="profile.basicInformation.marriageCertificate as marriageCertificate">
          <div class="file-entry">
            <button type="button" class="file-chip" pButton pRipple [label]="
                ('profileApproval.detail.snapshot.marriageCertificate' | translate) +
                ': ' +
                (marriageCertificate.fileName || '-')
              " (click)="preview(marriageCertificate.url, marriageCertificate.fileName)"
              [pTooltip]="('profileApproval.detail.snapshot.marriageCertificate' | translate) + ': ' + (marriageCertificate.fileName || '-')"
              tooltipPosition="top" icon="pi pi-external-link" iconPos="right"></button>
            <app-item-inline-review *ngIf="reviewItemFor(marriageCertificate.resourceId) as review"
              [reviewItemId]="review.reviewItemId" [status]="review.status" [note]="review.note"
              (review)="reviewItem.emit($event)"></app-item-inline-review>
          </div>
        </ng-container>
      </div>
    </p-card>
  </div>
</div>
