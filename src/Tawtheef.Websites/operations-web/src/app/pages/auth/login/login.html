





<div class="" i18nNamespace="pages/auth">
  <section class="login-wrapper">
    <div class="container h-100">
      <div class="row align-items-center h-100">
           <div class="col-lg-6 d-lg-flex d-none">
                 <div class="login-background">
            <div class="authentication-card w-100">
                 <img src="../../../../assets/img/login-bg.png" alt="Img" class="img-fluid">
                <div class="authen-overlay-content">
                  <h2 class="text-white fw-bold">مرحباً بكم في بوابة التوظيف</h2>
                  <p class="text-white fs-20 fw-semibold">منصة موحدة لإدارة طلبات التوظيف</p>
                </div>
            </div>
          </div>
          </div>
           <div class="col-lg-6 col-md-12 col-sm-12">
                <div class="row align-items-center mb-3">
                     <div class="col-md-8"><div><img class="logo" src="assets/img/logo-black.png" alt="{{ 'auth.login.ministry_name' | translate }}"></div></div>
                     <div class="col-md-4 text-end"><button type="button" class="btn btn-outline-primary btn-sm" (click)="toggleLang()">{{ currentLang === 'ar' ? 'English' : 'عربي' }} </button></div>
                </div>
                 <div class="w-100 my-5">
                     <h2 class="fw-bold fs-4">{{ 'auth.azure.title' | translate }}</h2>
                     <p class="hint">{{ 'auth.azure.hint' | translate }}</p>
                 </div>


                 <button type="button" class="btn btn-primary btn-lg w-100 mb-3" (click)="startLogin('azure')">
                     <img class="icon" src="assets/icons/azure.svg" alt="" height="30">
                     <span>{{ 'auth.azure.cta' | translate }}</span>
                 </button>
             <div class="title-wrapper">
               <span class="title-text">او</span>
             </div>
                 <div class="text-center my-5">
                     <h5 class="fw-bold ">للمستخدمين غير المقيمين في دولة قطر</h5>
                     <button type="button" class="btn btn-outline-primary w-100 btn-lg my-3" (click)="startLogin('google')">
                       <i class="fa-brands fa-google"></i>
                       <span>{{ 'auth.login.google_cta' | translate }}</span>
                     </button>
                 </div>


           </div>

      </div>
    </div>
  </section>
</div>
