<div class="pending-wrapper d-flex align-items-center justify-content-center" i18nNamespace="pages/auth">
    <div class="container pb-lg-5 pb-3">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-10">
                <div class="card border-0 shadow-sm premium-card overflow-hidden">
                    <div class="row g-0">
                        <div
                            class="col-md-5 d-none d-md-flex align-items-center justify-content-center bg-light-soft position-relative overflow-hidden">
                            <div class="decoration-circle-1"></div>
                            <div class="decoration-circle-2"></div>
                            <a routerLink="/">
                                <img src="assets/img/logo-black.png"
                                    class="mini-logo position-absolute top-0 start-0 m-4" height="40">
                            </a>
                            <div class="p-4 text-center">
                                <div class="pulse-icon mb-4">
                                    <i class="hgi hgi-stroke hgi-user-search-01 fs-huge text-primary"></i>
                                </div>
                                <h4 class="fw-bold text-gray-800">{{ 'pending.title' | translate }}</h4>
                            </div>
                        </div>
                        <div class="col-md-7">
                            <div class="card-body p-lg-5 p-4">
                                <div class="d-md-none text-center mb-4">
                                    <a routerLink="/">
                                        <img src="assets/img/logo-black.png" height="45">
                                    </a>
                                </div>

                                <h2 class="h3 fw-bold mb-3 text-primary">{{ 'pending.title' | translate }}</h2>
                                <p class="fs-16 fw-medium text-gray-700 mb-4">{{ 'pending.subtitle' | translate }}</p>

                                <div class="alert alert-info border-0 bg-info-light-active p-4 rounded-4 mb-4">
                                    <div class="d-flex gap-3">
                                        <i class="hgi hgi-stroke hgi-information-circle fs-1 text-info mt-1"></i>
                                        <div>
                                            <p class="mb-0 fs-14 lh-lg">{{ 'pending.detail' | translate }}</p>
                                        </div>
                                    </div>
                                </div>

                                <div class="progress-steps mb-5 mt-2">
                                    <div class="step-line complete">
                                        <div class="step-circle"><i class="hgi hgi-stroke hgi-tick-02"></i></div>
                                        <span class="step-label">{{ 'pending.step1' | translate }}</span>
                                    </div>
                                    <div class="step-line current">
                                        <div class="step-circle">2</div>
                                        <span class="step-label">{{ 'pending.step2' | translate }}</span>
                                    </div>
                                    <div class="step-line">
                                        <div class="step-circle">3</div>
                                        <span class="step-label">{{ 'pending.step3' | translate }}</span>
                                    </div>
                                </div>

                                <button class="btn btn-outline-secondary btn-lg w-100 rounded-pill mt-auto"
                                    (click)="logout()">
                                    <i class="hgi hgi-stroke hgi-logout-01 me-2"></i>
                                    <span>{{ 'pending.logout' | translate }}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
