<p-card class="shadow-sm photo-card text-center">
  <ng-template pTemplate="header">
    <div class="d-flex align-items-center gap-2 justify-content-center">
      <i class="pi pi-image text-primary"></i>
      <span class="fw-bold">{{ 'profileApproval.sections.profilePhoto' | translate }}</span>
    </div>
  </ng-template>

  <img [src]="profilePhoto || 'assets/img/avatar.png'" alt="profile-photo" class="img-fluid rounded" />
</p-card>
