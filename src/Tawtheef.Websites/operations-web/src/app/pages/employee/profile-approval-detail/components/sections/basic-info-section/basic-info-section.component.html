<div class="row g-3">
  <div class="col-12 col-lg-8">
    <p-card class="shadow-sm h-100 section-panel">
      <ng-template pTemplate="header">
        <div class="card-head">
          <span class="icon-circle text-primary bg-light">
            <i class="pi pi-id-card"></i>
          </span>
          <div class="d-flex flex-column">
            <span class="fw-bold">{{ 'profileApproval.detail.snapshot.title' | translate }}</span>
            <small class="text-muted">{{ 'profileApproval.detail.snapshot.subtitle' | translate }}</small>
          </div>
        </div>
      </ng-template>

      <div class="info-grid">
        <div
          class="info-chip"
          *ngFor="let field of [
            { label: 'profileApproval.detail.snapshot.nationalNumber', value: profile.basicInformation.nationalNumber },
            { label: 'profileApproval.detail.snapshot.fullNameAr', value: profile.basicInformation.fullNameAr },
            { label: 'profileApproval.detail.snapshot.fullNameEn', value: profile.basicInformation.fullNameEn },
            { label: 'profileApproval.detail.snapshot.birthDate', value: profile.basicInformation.birthDate },
            { label: 'profileApproval.detail.snapshot.gender', value: profile.basicInformation.gender },
            { label: 'profileApproval.detail.snapshot.nationality', value: profile.basicInformation.nationality },
            { label: 'profileApproval.detail.snapshot.religion', value: profile.basicInformation.religion },
            { label: 'profileApproval.detail.snapshot.maritalStatus', value: profile.basicInformation.maritalStatus },
            { label: 'profileApproval.detail.snapshot.childrenCount', value: profile.basicInformation.childrenCount ?? '-' }
          ]"
        >
          <div class="chip-label">{{ field.label | translate }}</div>
          <div class="chip-value">{{ field.value || '-' }}</div>
        </div>
      </div>
    </p-card>
  </div>

  <div class="col-12 col-lg-4" *ngIf="hasBasicFiles()">
    <p-card class="shadow-sm h-100 section-panel">
      <ng-template pTemplate="header">
        <div class="card-head">
          <span class="icon-circle text-primary bg-light">
            <i class="pi pi-paperclip"></i>
          </span>
          <span class="fw-bold">{{ 'profileApproval.detail.snapshot.files' | translate }}</span>
        </div>
      </ng-template>

      <div class="file-stack">
        <button
          type="button"
          class="file-chip"
          *ngIf="profile.basicInformation.resumeAttachment"
          pButton
          pRipple
          [label]="
            ('profileApproval.detail.snapshot.resumeAttachment' | translate) +
            ': ' +
            (profile.basicInformation.resumeAttachment.fileName || '-')
          "
          (click)="preview(profile.basicInformation.resumeAttachment.url)"
          icon="pi pi-external-link"
          iconPos="right"
        ></button>

        <button
          type="button"
          class="file-chip"
          *ngIf="profile.basicInformation.nationalCard"
          pButton
          pRipple
          [label]="
            ('profileApproval.detail.snapshot.nationalCard' | translate) +
            ': ' +
            (profile.basicInformation.nationalCard.fileName || '-')
          "
          (click)="preview(profile.basicInformation.nationalCard.url)"
          icon="pi pi-external-link"
          iconPos="right"
        ></button>

        <button
          type="button"
          class="file-chip"
          *ngIf="profile.basicInformation.birthdayCertificate"
          pButton
          pRipple
          [label]="
            ('profileApproval.detail.snapshot.birthdayCertificate' | translate) +
            ': ' +
            (profile.basicInformation.birthdayCertificate.fileName || '-')
          "
          (click)="preview(profile.basicInformation.birthdayCertificate.url)"
          icon="pi pi-external-link"
          iconPos="right"
        ></button>

        <button
          type="button"
          class="file-chip"
          *ngIf="profile.basicInformation.marriageCertificate"
          pButton
          pRipple
          [label]="
            ('profileApproval.detail.snapshot.marriageCertificate' | translate) +
            ': ' +
            (profile.basicInformation.marriageCertificate.fileName || '-')
          "
          (click)="preview(profile.basicInformation.marriageCertificate.url)"
          icon="pi pi-external-link"
          iconPos="right"
        ></button>

        <button
          type="button"
          class="file-chip"
          *ngIf="profile.basicInformation.residenceAddressCertificate"
          pButton
          pRipple
          [label]="
            ('profileApproval.detail.snapshot.residenceAddressCertificate' | translate) +
            ': ' +
            (profile.basicInformation.residenceAddressCertificate.fileName || '-')
          "
          (click)="preview(profile.basicInformation.residenceAddressCertificate.url)"
          icon="pi pi-external-link"
          iconPos="right"
        ></button>
      </div>
    </p-card>
  </div>
</div>
