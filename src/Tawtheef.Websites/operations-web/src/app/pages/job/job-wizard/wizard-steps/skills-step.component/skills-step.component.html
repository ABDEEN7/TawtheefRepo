<div class="card card-lite p-3 mb-3" [formGroup]="form">
  <h6 class="mb-3 text-brand fw-bold">{{ 'JOB_WIZARD.STEPS.SKILLS.TILTLE' | translate }}</h6>

  <!-- Add Skill Button -->
  <div class="mb-3">
    <button class="btn btn-outline-brand" (click)="addSkill()">
      <i class="fa fa-plus me-2"></i>
      {{ 'JOB_WIZARD.STEPS.SKILLS.ADD_SKILL' | translate }}
    </button>
  </div>

  <!-- Skills List -->
  <div formArrayName="jobSkills">
    @for (skillGroup of items.controls; track $index; let i = $index) {
      <div class="card mb-3 border" [formGroupName]="i">
        <div class="card-body">
          <div class="row align-items-center">
            
            <!-- Skill Selection -->
            <div class="col-md-4 mb-3 mb-md-0">
              <label class="form-label fw-bold text-muted small">
                {{ 'JOB_WIZARD.STEPS.SKILLS.SKILL' | translate }} {{ i + 1 }}
              </label>
              <p-select
               [options]="lookupsService.skills()"
                formControlName="skillId"
                optionLabel="name"
                optionValue="id"
                [showClear]="true"
                placeholder="{{ 'JOB_WIZARD.STEPS.SKILLS.SKILL_PLACEHOLDER' | translate }}"
                class="w-100">
              </p-select>
            </div>

            <!-- Show to Applicants Toggle -->
            <div class="col-md-4 mb-3 mb-md-0">
              <div class="form-check form-switch">
                <input 
                  class="form-control form-check-input" 
                  type="checkbox" 
                  formControlName="showToApplicants"
                  id="showToApplicants{{i}}">
                <label class="form-check-label" for="showToApplicants{{i}}">
                  {{ 'JOB_WIZARD.STEPS.SKILLS.SHOW_TO_APPLICANTS' | translate }}
                </label>
              </div>
            </div>

            <!-- Remove Button -->
            <div class="col-md-4 text-md-end">
              <button class="btn btn-outline-danger btn-sm" (click)="removeSkill(i)" type="button">
                <i class="fa fa-trash me-1"></i>
                {{ 'COMMON.REMOVE' | translate }}
              </button>
            </div>

          </div>
        </div>
      </div>
    }
    
    @if (items.length === 0) {
      <div class="text-center py-5">
        <i class="fa fa-code fa-3x text-muted mb-3"></i>
        <p class="text-muted">{{ 'job_wizard.steps.skills.empty_state' | translate }}</p>
      </div>
    }
  </div>
</div>
