<form [formGroup]="form">
  <div class="card card-lite p-3 mb-3">
    <div class="flex">
      <i class="fa fa-info-circle"> </i>
      <span class="mb-3 text-brand fw-bold">{{ 'JOB_WIZARD.NAVIGATION.WIZARD_STEPS.OVERVIEW' | translate }}</span>
    </div>

    <div class="row g-3">
      <div class="col-lg-12 col-md-12">
        <label class="form-label fw-bold">{{ 'JOB_WIZARD.STEPS.OVERVIEW.DESCRIPTION_AR' | translate }}</label>
        <textarea 
          formControlName="overview" 
          class="form-control" 
          rows="10"
          placeholder="{{ 'JOB_WIZARD.STEPS.OVERVIEW.DESCRIPTION_PLACEHOLDER' | translate }}">
        </textarea>
        
        @if (form.controls.overview.touched && form.controls.overview.invalid) {
          <div class="text-danger small">{{ 'VALIDATION.REQUIRED_FIELD' | translate }}</div>
        }
      </div>
    </div>
  </div>
</form>
