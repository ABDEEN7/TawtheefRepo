@if (note?.note && currentJob?.jobStatus?.backendName == jobStatuses.NeedUpdate) {
  <div class="alert alert-warning mb-3 p-3">

    <div class="d-flex align-items-center mb-2">
      <i class="fa fa-circle-exclamation me-2 text-warning"></i>
      <strong>{{ 'JOB_WIZARD.REVIEW_NOTES.TITLE' | translate }}</strong>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">
        {{ 'JOB_WIZARD.REVIEW_NOTES.NOTE' | translate }}
      </label>

      <textarea
        class="form-control"
        rows="4"
        readonly
      >{{ note?.note }}</textarea>
    </div>

   

  </div>
}
