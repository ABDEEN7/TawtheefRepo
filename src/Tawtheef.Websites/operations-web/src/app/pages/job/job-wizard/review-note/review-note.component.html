@if (note) {
  <div class="alert alert-warning mb-3 p-3">

    <!-- Header -->
    <div class="d-flex align-items-center mb-2">
      <i class="fa fa-circle-exclamation me-2 text-warning"></i>
      <strong>{{ 'JOB_WIZARD.REVIEW_NOTES.TITLE' | translate }}</strong>
    </div>

    <!-- Note text -->
    <div class="mb-3">
      <label class="form-label fw-semibold">
        {{ 'JOB_WIZARD.REVIEW_NOTES.NOTE' | translate }}
      </label>

      <textarea
        class="form-control"
        rows="4"
        readonly
      >{{ note.note }}</textarea>
    </div>

    <!-- Attachments -->
    @if (note.attachments?.length) {
      <div>
        <label class="form-label fw-semibold mb-2">
          {{ 'JOB_WIZARD.REVIEW_NOTES.ATTACHMENTS' | translate }}
        </label>

        <div class="d-flex flex-column gap-2">
          @for (file of note.attachments; track file.id) {
            <div class="attachment-row d-flex align-items-center justify-content-between">

              <div class="d-flex align-items-center gap-2">
                <i [class]="fileIcon(file.fileName)"></i>
                <span class="small">{{ file.fileName }}</span>
              </div>

              <div class="d-flex gap-2">
                <button
                  type="button"
                  class="btn btn-sm btn-outline-secondary"
                  (click)="preview(file)">
                  <i class="fa fa-eye"></i>
                </button>

                <button
                  type="button"
                  class="btn btn-sm btn-outline-primary"
                  (click)="download(file)">
                  <i class="fa fa-download"></i>
                </button>
              </div>

            </div>
          }
        </div>
      </div>
    }

  </div>
}
