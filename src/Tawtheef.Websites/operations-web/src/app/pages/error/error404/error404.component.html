<div class="error-box">
  <img src="../../../../assets/img/error/img-01.svg" [alt]="'decorativeElement' | translate" class="img-fluid bg-01"/>
  <img src="../../../../assets/img/error/img-02.svg" [alt]="'decorativeElement' | translate" class="img-fluid bg-02"/>
  <img src="../../../../assets/img/error/img-03.svg" [alt]="'decorativeElement' | translate" class="img-fluid bg-03"/>
  <img src="../../../../assets/img/error/img-04.svg" [alt]="'decorativeElement' | translate" class="img-fluid bg-04"/>
  <img src="../../../../assets/img/error/img-05.svg" [alt]="'decorativeElement' | translate" class="img-fluid bg-05"/>
  <img src="../../../../assets/img/error/img-06.svg" [alt]="'decorativeElement' | translate" class="img-fluid bg-06"/>
  <div class="error-logo">
    <a [routerLink]="routes.home">
      <img src="../../../../assets/img/logo.svg" class="img-fluid" [alt]="'logoAltText' | translate"/>
    </a>
  </div>
  <div class="error-box-img">
    <img src="../../../../assets/img/error/error-01.svg" [alt]="'notFoundImage' | translate" class="img-fluid"/>
  </div>
  <h3 class="h2 mb-3">
    {{ 'app.error404.ohNoError' | translate }} <span class="text-secondary ms-1">404</span>
  </h3>
  <p class="h4 font-weight-normal">
    {{ 'app.error404.pageNotFoundMessage' | translate }}
  </p>
  <a [routerLink]="routes.home" class="btn back-to-home-btn">
    <i class="isax isax-arrow-left-2 me-1"></i> {{ 'app.error404.backToHome' | translate }}
  </a>
</div>
