<div i18nNamespace="pages/auth" class="qatar-otp-dialog">
  <p class="text-muted mb-3">{{ 'auth.login.qatarResidentDialog.subtitle' | translate }}</p>

  <form [formGroup]="step === 'identify' ? requestForm : otpForm"
        (ngSubmit)="step === 'identify' ? submitIdentification() : submitOtp()">

    <div class="mb-3" *ngIf="step === 'identify'">
      <label class="form-label required" for="qid">{{ 'auth.login.qatarResidentDialog.qid' | translate }}</label>
      <input
        id="qid"
        type="text"
        class="form-control"
        pInputText
        formControlName="qid"
        [readonly]="requestForm.disabled"
        autocomplete="off" />
      <small class="text-danger" *ngIf="requestForm.controls.qid.touched && requestForm.controls.qid.invalid">
        {{ 'validation.required' | translate }}
      </small>
    </div>

    <div class="mb-3" *ngIf="step === 'identify'">
      <label class="form-label required" for="phoneNumber">{{ 'auth.login.qatarResidentDialog.phone' | translate }}</label>
      <input
        id="phoneNumber"
        type="tel"
        class="form-control"
        pInputText
        formControlName="phoneNumber"
        [readonly]="requestForm.disabled"
        autocomplete="tel" />
      <small class="text-danger" *ngIf="requestForm.controls.phoneNumber.touched && requestForm.controls.phoneNumber.invalid">
        {{ 'validation.required' | translate }}
      </small>
    </div>

    <div class="mb-3" *ngIf="step === 'otp'">
      <label class="form-label required" for="otp">{{ 'auth.login.qatarResidentDialog.otp' | translate }}</label>
      <input
        id="otp"
        type="text"
        class="form-control"
        pInputText
        formControlName="otp"
        autocomplete="one-time-code" />
      <small class="text-danger" *ngIf="otpForm.controls.otp.touched && otpForm.controls.otp.invalid">
        {{
          otpForm.controls.otp.errors?.['minlength']
            ? ('validation.minLength' | translate:{ min: 4 })
            : ('validation.required' | translate)
        }}
      </small>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
      <button pButton type="button" class="p-button-text" (click)="close()" [disabled]="loading">
        {{ 'common.cancel' | translate }}
      </button>
      <button pButton type="submit" [loading]="loading" [disabled]="loading">
        {{ step === 'identify'
        ? ('auth.login.qatarResidentDialog.requestCta' | translate)
        : ('auth.login.qatarResidentDialog.verifyCta' | translate) }}
      </button>
    </div>

  </form>
</div>
