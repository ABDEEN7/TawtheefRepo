<div i18nNamespace="pages/auth" class="qatar-otp-dialog">
  <p class="text-muted mb-3">{{ 'auth.login.qatarResidentDialog.subtitle' | translate }}</p>

  <form (ngSubmit)="step === 'identify' ? submitIdentification() : submitOtp()">
    <div class="mb-3">
      <label class="form-label required" for="qid">{{ 'auth.login.qatarResidentDialog.qid' | translate }}</label>
      <input
        id="qid"
        type="text"
        class="form-control"
        pInputText
        [formControl]="qidControl"
        [readonly]="requestForm.disabled"
        autocomplete="off" />
      <small class="text-danger" *ngIf="qidControl?.touched && qidControl?.invalid">
        {{ 'validation.required' | translate }}
      </small>
    </div>

    <div class="mb-3">
      <label class="form-label required" for="phoneNumber">{{ 'auth.login.qatarResidentDialog.phone' | translate }}</label>
      <input
        id="phoneNumber"
        type="tel"
        class="form-control"
        pInputText
        [formControl]="phoneControl"
        [readonly]="requestForm.disabled"
        autocomplete="tel" />
      <small class="text-danger" *ngIf="phoneControl?.touched && phoneControl?.invalid">
        {{ 'validation.required' | translate }}
      </small>
    </div>

    <div class="mb-3" *ngIf="step === 'otp'">
      <label class="form-label required" for="otp">{{ 'auth.login.qatarResidentDialog.otp' | translate }}</label>
      <input
        id="otp"
        type="text"
        class="form-control"
        pInputText
        [formControl]="otpControl"
        autocomplete="one-time-code" />
      <small class="text-danger" *ngIf="otpControl?.touched && otpControl?.invalid">
        {{ otpControl?.errors?.['minlength'] ? ('validation.minLength' | translate:{ min: 4 }) : ('validation.required' | translate) }}
      </small>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
      <button pButton type="button" class="p-button-text" (click)="close()" [disabled]="loading">
        {{ 'common.cancel' | translate }}
      </button>
      <button pButton type="submit" [loading]="loading" [disabled]="loading">
        {{ step === 'identify' ? ('auth.login.qatarResidentDialog.requestCta' | translate) : ('auth.login.qatarResidentDialog.verifyCta' | translate) }}
      </button>
    </div>
  </form>
</div>
