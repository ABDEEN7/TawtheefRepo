<div i18nNamespace="pages/auth">
  <section class="align-content-center login-wrapper">
    <div class="container h-100">
      <div class="row align-items-center h-100 login-shell">
        <div class="col-lg-6 d-lg-flex d-none">
          <div class="login-background">
            <div class="authentication-card w-100">
              <img src="../../../../assets/img/login-bg.jpg" alt="Img" class="img-fluid">
              <div class="authen-overlay-content">
                <h2 class="text-white fw-bold">{{ 'auth.login.welcome' | translate }}</h2>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-6 col-md-12 col-sm-12">
          <div class="login-panel">
          <div class="row align-items-center mb-3 login-header">
            <div class="col-md-8 login-brand">
              <div>
                <a href="" (click)="navigateToHome($event)">
                  <img class="logo" src="assets/img/logo-black.png" alt="{{ 'auth.login.ministry_name' | translate }}">
                </a>
              </div>
              <div class="fw-bold fs-4 ">{{ 'auth.login.tawtheef' | translate }}</div>
            </div>
            <div class="col-md-4 text-end login-language">
              <button type="button" class="btn btn-outline-primary btn-sm" (click)="toggleLang()"> {{ currentLang ===
                'ar' ? 'English' : 'عربي' }}</button>
            </div>
          </div>
          <div class="w-100 login-intro">
            <h2 class="fw-bold fs-4"></h2>
            <h5 class="hint">{{ 'auth.login.choose_residency' | translate }}</h5>
          </div>

          @if (auth.loading && auth.popupStatusKey) {
          <div class="alert alert-info py-2 px-3 mb-3" role="status" aria-live="polite">
            {{ auth.popupStatusKey | translate }}
          </div>
          }

          <!--                  <button type="button" class="btn btn-primary btn-lg w-100 mb-3" (click)="startLogin('qatar_pass')">-->
          <!--                    <i class="fa-solid fa-shield-halved"></i>-->
          <!--                    <span>{{ 'auth.login.tawtheeq_cta' | translate }}</span>-->
          <!--                  </button>-->
          <button type="button" class="btn btn-primary btn-lg w-100 mb-3" (click)="startLogin('qatar_resident')"
            [disabled]="auth.loading">
            <i class="fa-solid fa-shield-halved"></i>
            <span>{{ 'auth.login.qatar_resident_cta' | translate }}</span>
          </button>
          <div class="title-wrapper"><span class="title-text">{{ 'auth.login.or' | translate }}</span></div>
          <div class="text-center non-resident-section">
            <h5 class="fw-bold ">{{ 'auth.login.non_qatar' | translate}}</h5>

            <button type="button" class="btn btn-outline-primary w-100 btn-lg my-3" (click)="startLogin('google')"
              [disabled]="auth.loading"><i class="fa-brands fa-google"></i><span>{{ 'auth.login.google_cta' | translate
                }}</span>
            </button>
          </div>



          </div>
        </div>
      </div>
    </div>
  </section>
</div>
