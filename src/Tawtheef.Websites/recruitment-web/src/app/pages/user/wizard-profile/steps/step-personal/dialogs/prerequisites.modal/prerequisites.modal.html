<div class="row g-3 mb-4">
  <!-- Candidate Type -->
  <div class="col-md-6">
    <label for="candidateType" class="form-label required">{{ 'wizard.prereq.candidateType' | translate }}</label>
    <p-select id="targetEntity" class="mt-2"
              [(ngModel)]="candidateType"
              [options]="lookups.candidateTypes()"
              optionLabel="name"
              fluid>
    </p-select>
  </div>

  <!-- Target Entity -->
  <div class="col-md-6">
    <label for="targetEntity" class="form-label required">{{ 'wizard.prereq.targetEntity' | translate }}</label>
    <p-select id="targetEntity" class="mt-2"
              [(ngModel)]="targetEntity"
              [options]="lookups.targetEntities()"
              optionLabel="name"
              fluid>
    </p-select>
  </div>

  <div class="col-12"><hr></div>

  <!-- CV Upload -->
  <div class="col-md-6">
    <label class="form-label required">{{ 'wizard.prereq.cvLabel' | translate }}</label>

    <div class="upload-drop"
         tabindex="0"
         (click)="cvInput.click()"
         (keydown.enter)="cvInput.click()"
         (dragover)="onDragOver($event)"
         (dragleave)="onDragLeave($event)"
         (drop)="onDrop($event, 'cv')">
      <i class="fa-solid fa-cloud-arrow-up me-2"></i>
      {{ 'wizard.prereq.dropOrClick' | translate }}
    </div>

    <input #cvInput
           id="preCV"
           type="file"
           class="d-none"
           accept=".pdf"
           (change)="onFilePicked($event, 'cv')"/>

    <div class="mt-2 small">
            <span *ngIf="cvFile; else cvEmpty">
              <i class="fa-solid fa-file-pdf me-1"></i> {{ cvFile.name }}
              <button type="button" class="btn btn-sm btn-link text-danger p-0 ms-2" (click)="clearFile('cv')">
                <i class="fa-solid fa-xmark"></i> {{ 'common.remove' | translate }}
              </button>
            </span>
      <ng-template #cvEmpty>—</ng-template>
    </div>

    <div *ngIf="cvError" class="text-danger small mt-1">
      <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ cvError }}
    </div>
  </div>

  <!-- ID Upload -->
  <div class="col-md-6">
    <label class="form-label required">{{ 'wizard.prereq.idLabel' | translate }}</label>

    <div class="upload-drop"
         tabindex="0"
         (click)="idInput.click()"
         (keydown.enter)="idInput.click()"
         (dragover)="onDragOver($event)"
         (dragleave)="onDragLeave($event)"
         (drop)="onDrop($event, 'id')">
      <i class="fa-solid fa-cloud-arrow-up me-2"></i>
      {{ 'wizard.prereq.dropOrClick' | translate }}
    </div>

    <input #idInput
           id="preID"
           type="file"
           class="d-none"
           accept=".pdf,image/*"
           (change)="onFilePicked($event, 'id')"/>

    <div class="mt-2 small">
            <span *ngIf="idFile; else idEmpty">
              <i class="fa-solid fa-id-card me-1"></i> {{ idFile.name }}
              <button type="button" class="btn btn-sm btn-link text-danger p-0 ms-2" (click)="clearFile('id')">
                <i class="fa-solid fa-xmark"></i> {{ 'common.remove' | translate }}
              </button>
            </span>
      <ng-template #idEmpty>—</ng-template>
    </div>

    <div *ngIf="idError" class="text-danger small mt-1">
      <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ idError }}
    </div>
  </div>

</div>
<button class="btn btn-brand text-end"
        id="startProfile"
        [disabled]="!canStart()"
        (click)="start()">
  {{ 'wizard.prereq.startProfile' | translate }}
</button>
