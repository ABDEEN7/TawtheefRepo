<section i18nNamespace="pages/user/wizard-profile">

  <div class="container-fluid container-narrow py-3">
       <div class="card card-table">
            <div class="card-body">
                 <div class="row">
                      <div class="col-12">
                           <div class="row align-items-center">
                                <div class="col-md-9">
                                  <div class="d-flex align-items-center gap-3">
                                    <div class="avatar-wrapper">
                                         <img #userPictureRef [src]="ds.state().avatarUrl || avatarPreviewUrl || 'https://placehold.co/76x76?text=Avatar'" (error)="userPictureRef.src ='https://placehold.co/76x76?text=Avatar'"
                                           class="candidate-avatar-pulse"  alt="{{ 'wizard.personal.avatar.alt' | translate }}" (click)="openAvatarDialog()"/>
                                         <div class="edit-badge" (click)="openAvatarDialog()"><i class="fa fa-camera"></i></div>
                                    </div>
                                    <div>
                                        <h3 class="fw-bold"> {{ ds.state().fullNameEn || ('wizard.personal.nameAr' | translate) }}</h3>
                           <p class="fs-16 m-0">{{ 'wizard.personal.avatar.hint' | translate }}</p>
                 </div>
                                  </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="d-flex justify-content-end align-items-center gap-3 form-check form-switch">
                                        <label class="form-check-label">{{ 'wizard.availability' | translate }}</label>
                                        <p-toggleswitch [ngModel]="ds.state().available"  (ngModelChange)="ds.up('available',$event)">
                                          <ng-template #handle let-checked="checked">
                                            <i [ngClass]="['!text-xs', 'pi', checked ? 'pi-check' : 'pi-times']"></i>
                                          </ng-template>
                                        </p-toggleswitch>
                                    </div>
                                </div>
                           </div>
                      </div>
                 </div>
                 <div class="row my-4">
                      <div class="col-12">
                  <div class="card card-table bg-light">
                    <div class="card-body">
                      <ul class="nav nav-pills flex-wrap stepper" aria-label="Profile steps">
                        <li class="nav-item" *ngFor="let label of stepLabels; let i = index">
                          <a class="nav-link"
                             [class.active]="step===i+1"
                             [class.disabled]="!canGoTo(i+1)"
                             [attr.aria-disabled]="!canGoTo(i+1)"
                             href
                             (click)="$event.preventDefault(); canGoTo(i+1) && go(i+1)">
            <span class="step-index" [ngClass]="{'is-complete': isStepValid(i+1), 'is-active': step===i+1}">
              <i class="fa-solid" [ngClass]="isStepValid(i+1) ? 'fa-check' : 'fa-circle'"></i>
            </span>
                            <span class="step-label">{{ label | translate }}</span>
                          </a>
                        </li>
                      </ul>
                    </div>
                  </div>
                </div>
                 </div>
                 <div class="row">
                      <div class="col-12">
                        <div class="card card-table mb-4 bg-light">
                          <div class="card-body">
                            <div *ngIf="loading" class="wizard-loading" role="status" aria-live="polite">
                              <div class="loading-spinner"></div>
                              <p class="loading-text">{{ 'wizard.loading' | translate }}</p>
                            </div>
                            <div *ngIf="!loading">
                              <app-step-first-info  *ngIf="step===1" (next)="next()"></app-step-first-info>
                              <app-step-personal    *ngIf="step===2" (back)="prev()" (next)="next()"></app-step-personal>
                              <app-step-contact     *ngIf="step===3" (back)="prev()" (next)="next()"></app-step-contact>
                              <app-step-degrees     *ngIf="step===4" (back)="prev()" (next)="next()"></app-step-degrees>
                              <app-step-experience  *ngIf="step===5" (back)="prev()" (next)="next()"></app-step-experience>
                              <app-step-achievements *ngIf="step===6" (back)="prev()" (next)="next()"></app-step-achievements>
                              <app-step-skills      *ngIf="step===7" (back)="prev()" (next)="next()"></app-step-skills>
                              <app-step-languages   *ngIf="step===8" (back)="prev()" (next)="next()"></app-step-languages>
                              <app-step-attachments *ngIf="step===9" (back)="prev()" (next)="next()"></app-step-attachments>
                              <app-step-review      *ngIf="step===10" (back)="prev()"></app-step-review>
                            </div>
                          </div>
                        </div>

                      </div>
                 </div>
            </div>

       </div>


  </div>
</section>
