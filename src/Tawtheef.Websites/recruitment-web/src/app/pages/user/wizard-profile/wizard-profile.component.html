<section i18nNamespace="pages/user/wizard-profile">
  <div class="container container-narrow py-3">
    <div class="wizard p-3 rounded-4 border">
      <div class="d-flex align-items-center justify-content-between flex-wrap mb-3">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
          <div class="d-flex align-items-center gap-3">
            <img
              [src]="ds.state().avatarUrl || avatarPreviewUrl || 'https://placehold.co/120x160?text=Avatar'"
              class="candidate-avatar"
              alt="{{ 'wizard.personal.avatar.alt' | translate }}"
              (click)="openAvatarDialog()"/>
            <div>
              <div class="fw-bold">
                {{ ds.state().fullName || ('wizard.personal.nameAr' | translate) }}
              </div>
              <div class="small text-muted">
                {{ 'wizard.personal.avatar.hint' | translate }}
              </div>
            </div>
          </div>
        </div>
        <div class="form-check form-switch">
          <label class="form-check-label fw-bold">{{ 'wizard.availability' | translate }}</label>
          <p-toggleswitch [(ngModel)]="ds.state().available"  (ngModelChange)="ds.up('available',$event)">
            <ng-template #handle let-checked="checked">
              <i [ngClass]="['!text-xs', 'pi', checked ? 'pi-check' : 'pi-times']"></i>
            </ng-template>
          </p-toggleswitch>
        </div>
      </div>

      <ul class="nav nav-pills flex-wrap stepper mb-3 border border-1">
        <li class="nav-item" *ngFor="let key of [
        'wizard.steps.firstInfo','wizard.steps.personal','wizard.steps.contact','wizard.steps.degrees',
        'wizard.steps.experience','wizard.steps.skills','wizard.steps.attachments']; let i = index">
          <a class="nav-link"
             [class.active]="step===i+1"
             [class.disabled]="!canGoTo(i+1)"
             [attr.aria-disabled]="!canGoTo(i+1)"
             href
             (click)="$event.preventDefault(); canGoTo(i+1) && go(i+1)">
            <i class="fa-solid"
               [class.fa-user]="i===0"
               [class.fa-house]="i===1"
               [class.fa-graduation-cap]="i===2"
               [class.fa-briefcase]="i===3"
               [class.fa-language]="i===4"
               [class.fa-paperclip]="i===5"
               [class.fa-check-circle]="i===6">
            </i>
            {{ key | translate }}
          </a>
        </li>
      </ul>
      <div *ngIf="loading" class="wizard-loading">
        {{ 'wizard.loading' | translate }}
      </div>

      <div *ngIf="!loading">
        <app-step-first-info  *ngIf="step===1" (next)="next()"></app-step-first-info>
        <app-step-personal    *ngIf="step===2" (next)="next()"></app-step-personal>
        <app-step-contact     *ngIf="step===3" (back)="prev()" (next)="next()"></app-step-contact>
        <app-step-degrees     *ngIf="step===4" (back)="prev()" (next)="next()"></app-step-degrees>
        <app-step-experience  *ngIf="step===5" (back)="prev()" (next)="next()"></app-step-experience>
        <app-step-skills      *ngIf="step===6" (back)="prev()" (next)="next()"></app-step-skills>
        <app-step-attachments *ngIf="step===7" (back)="prev()" (next)="next()"></app-step-attachments>
        <app-step-review      *ngIf="step===8" (back)="prev()"></app-step-review>
      </div>
    </div>
  </div>
</section>
