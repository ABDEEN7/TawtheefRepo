<div class="card border border-1 shadow-none rounded-4 p-4 mb-3 step-languages">
  <div class="row g-4">
    <div class="col-12">
      <div class="section-head">
        <h6 class="fw-bold mb-1 text-brand">{{ 'wizard.skills.languages' | translate }}</h6>
        <small class="text-muted d-block">{{ 'wizard.skills.languagesHint' | translate }}</small>
      </div>

      <div class="d-flex flex-wrap gap-2 mb-2 align-items-start">
        <p-select
          [options]="lookups.languages()"
          optionLabel="name"
          [(ngModel)]="newLanguage"
          [placeholder]="'wizard.skills.selectLanguage' | translate"
          [showClear]="true"
          class="w-language"
        ></p-select>

        <p-select
          [options]="lookups.languageLevels()"
          optionLabel="name"
          [(ngModel)]="newLevel"
          [placeholder]="'wizard.skills.selectLevel' | translate"
          [showClear]="true"
          class="w-level"
        ></p-select>

        <button class="btn btn-outline-primary rounded-pill" (click)="addLang()">
          <i class="fa-solid fa-plus"></i> {{ 'wizard.buttons.add' | translate }}
        </button>
      </div>

      <p-table [value]="ds.state().languages" class="p-datatable-sm">
        <ng-template pTemplate="header">
          <tr>
            <th>{{ 'wizard.skills.language' | translate }}</th>
            <th>{{ 'wizard.skills.level' | translate }}</th>
            <th class="text-end">{{ 'wizard.table.actions' | translate }}</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-r let-i="rowIndex">
          <tr>
            <td>{{ r.lang.name }}</td>
            <td><span class="badge rounded-pill bg-soft">{{ r.level.name }}</span></td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-danger rounded-pill"
                      (click)="removeLang(i)"
                      pTooltip="{{ 'wizard.buttons.delete' | translate }}">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="3" class="text-center text-muted">
              {{ 'wizard.table.noRows' | translate }}
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>

<div class="text-end">
  <button class="btn btn-outline-secondary rounded-pill" (click)="back.emit()">
    <i class="fa-solid me-1" faDirArrow="start"></i>
    {{ 'wizard.buttons.prev' | translate }}
  </button>
  <button class="btn btn-brand rounded-pill ms-2" (click)="onNext()">
    {{ 'wizard.buttons.next' | translate }}
    <i class="fa-solid ms-1" faDirArrow="end"></i>
  </button>
</div>
