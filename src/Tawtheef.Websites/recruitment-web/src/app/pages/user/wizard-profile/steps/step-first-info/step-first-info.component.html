<div class="card border border-1 shadow-none rounded-4 p-4 mb-3">
  <div class="row g-3">
    <div class="col-md-6">
      <label for="candidateType" class="form-label required">{{ 'wizard.prereq.candidateType' | translate }}</label>
      <p-select [options]="lookups.candidateTypes()" [(ngModel)]="ds.state().candidateType"
                [filter]="false" [loading]="false" filterBy="name" optionLabel="name" size="small"
                class="w-full md:w-56"
                [placeholder]="'wizard.placeholders.selectCandidateType' | translate"
                (ngModelChange)="ds.up('candidateType',$event)" fluid></p-select>
    </div>
    <div class="col-md-6">
      <label for="targetEntity" class="form-label required">{{ 'wizard.prereq.targetEntity' | translate }}</label>
      <p-select [options]="lookups.targetEntities()" [(ngModel)]="ds.state().targetEntity"
                [filter]="false" [loading]="false" filterBy="name" optionLabel="name" size="small"
                class="w-full md:w-56"
                [placeholder]="'wizard.placeholders.selectTargetEntity' | translate"
                (ngModelChange)="ds.up('targetEntity',$event)" fluid></p-select>
    </div>

    <div class="col-12"><hr></div>

    <div class="col-md-6">
      <label class="form-label required">
        {{ 'wizard.prereq.cvLabel' | translate }}
        <span class="text-muted fz-2xs">(JPG, PNG, PDF)</span>
      </label>
      <div class="d-flex gap-2 align-items-center">
        <input pInputText class="form-control" pSize="small" name="cvName"
               [ngModel]="ds.state().cvName"
               placeholder="{{ 'wizard.prereq.cvLabel' | translate }}"
               readonly
        />
        <button type="button"
                class="btn btn-outline-secondary btn-sm"
                (click)="cvInput.click()"
                [disabled]="uploading['cv']">
          <i *ngIf="!uploading['cv']" class="fa-solid fa-upload"></i>
          <i *ngIf="uploading['cv']" class="fa-solid fa-spinner fa-spin"></i>
        </button>
        <input #cvInput
               type="file"
               accept=".jpg,.jpeg,.png,.pdf"
               class="d-none"
               (change)="onFileSelected('cv', $event)" />
      </div>
    </div>
    <div class="col-md-6">
      <label class="form-label required">
        {{ 'wizard.prereq.idLabel' | translate }}
        <span class="text-muted fz-2xs">(JPG, PNG, PDF)</span>
      </label>
      <div class="d-flex gap-2 align-items-center">
        <input pInputText class="form-control" pSize="small" name="idName"
               [ngModel]="ds.state().idName"
               placeholder="{{ 'wizard.prereq.idLabel' | translate }}"
               readonly
        />
        <button type="button"
                class="btn btn-outline-secondary btn-sm"
                (click)="idInput.click()"
                [disabled]="uploading['id']">
          <i *ngIf="!uploading['id']" class="fa-solid fa-upload"></i>
          <i *ngIf="uploading['id']" class="fa-solid fa-spinner fa-spin"></i>
        </button>
        <input #idInput
               type="file"
               accept=".jpg,.jpeg,.png,.pdf"
               class="d-none"
               (change)="onFileSelected('id', $event)" />
      </div>
    </div>
    <div class="col-md-6" *ngIf="isNeedBirthCertificate">
      <label class="form-label required">
        {{ 'wizard.prereq.birthCertificate' | translate }}
        <span class="text-muted fz-2xs">(JPG, PNG, PDF)</span>
      </label>
      <div class="d-flex gap-2 align-items-center">
        <input pInputText class="form-control" pSize="small" name="birthCertificateName"
               [ngModel]="ds.state().birthCertificateName"
               placeholder="{{ 'wizard.prereq.birthCertificate' | translate }}"
               readonly
        />
        <button type="button"
                class="btn btn-outline-secondary btn-sm"
                (click)="birthInput.click()"
                [disabled]="uploading['birth']">
          <i *ngIf="!uploading['birth']" class="fa-solid fa-upload"></i>
          <i *ngIf="uploading['birth']" class="fa-solid fa-spinner fa-spin"></i>
        </button>
        <input #birthInput
               type="file"
               accept=".jpg,.jpeg,.png,.pdf"
               class="d-none"
               (change)="onFileSelected('birth', $event)" />
      </div>
    </div>
    <div class="col-md-6" *ngIf="isNeedMarriageCertificate">
      <label class="form-label required">
        {{ 'wizard.prereq.marriageCertificate' | translate }}
        <span class="text-muted fz-2xs">(JPG, PNG, PDF)</span>
      </label>
      <div class="d-flex gap-2 align-items-center">
        <input pInputText class="form-control" pSize="small" name="marriageCertificateName"
               [ngModel]="ds.state().marriageCertificateName"
               placeholder="{{ 'wizard.prereq.marriageCertificate' | translate }}"
               readonly
        />
        <button type="button"
                class="btn btn-outline-secondary btn-sm"
                (click)="marriageInput.click()"
                [disabled]="uploading['marriage']">
          <i *ngIf="!uploading['marriage']" class="fa-solid fa-upload"></i>
          <i *ngIf="uploading['marriage']" class="fa-solid fa-spinner fa-spin"></i>
        </button>
        <input #marriageInput
               type="file"
               accept=".jpg,.jpeg,.png,.pdf"
               class="d-none"
               (change)="onFileSelected('marriage', $event)" />
      </div>
    </div>
  </div>
</div>
<div class="text-end">
  <button class="btn btn-brand"
          type="button"
          (click)="onNext()"
          [disabled]="saving">
    <span *ngIf="!saving">
      {{ 'wizard.buttons.next' | translate }}
      <i class="fa-solid ms-1" faDirArrow="end"></i>
    </span>
    <span *ngIf="saving">
      <i class="fa-solid fa-spinner fa-spin me-1"></i>
      {{ 'wizard.buttons.saving' | translate }}
    </span>
  </button>
</div>
