<div  i18nNamespace="pages/user/profile-overview">
  <div class="d-flex align-items-center justify-content-between mb-3">
     <div class="p-dialog-title">{{ 'profileView.editDialog.title' | translate }}</div>
    <button class="btn btn-sm btn-outline-secondary" type="button" (click)="close()">
      {{ 'profileView.editDialog.close' | translate }}
    </button>
  </div>

  @if (loading()) {
    <div class="">{{ 'common.loading' | translate }}</div>
  } @else if (vmReady()) {
    <ng-container [ngSwitch]="sectionKey()">
      <app-step-prereq *ngSwitchCase="'prerequisites'"
                       [submitLabelKey]="'common.save'"
                       [requireChanges]="true"
                       (next)="close()">
      </app-step-prereq>

      <app-step-personal *ngSwitchCase="'personal'"
                         [submitLabelKey]="'common.save'"
                         [showBack]="false"
                         [requireChanges]="true"
                         (back)="close()"
                         (next)="close()">
      </app-step-personal>

      <app-step-contact *ngSwitchCase="'contact'"
                        [submitLabelKey]="'common.save'"
                        [showBack]="false"
                        [requireChanges]="true"
                        (back)="close()"
                        (next)="close()">
      </app-step-contact>

      <app-step-degrees *ngSwitchCase="'qualifications'"
                        [submitLabelKey]="'common.save'"
                        [showBack]="false"
                        [requireChanges]="true"
                        (back)="close()"
                        (next)="close()">
      </app-step-degrees>

      <app-step-experience *ngSwitchCase="'experience'"
                           [submitLabelKey]="'common.save'"
                           [showBack]="false"
                           [requireChanges]="true"
                           (back)="close()"
                           (next)="close()">
      </app-step-experience>

      <app-step-experience *ngSwitchCase="'training'"
                           [submitLabelKey]="'common.save'"
                           [showBack]="false"
                           [requireChanges]="true"
                           (back)="close()"
                           (next)="close()">
      </app-step-experience>

      <app-step-achievements *ngSwitchCase="'achievements'"
                             [submitLabelKey]="'common.save'"
                             [showBack]="false"
                             [requireChanges]="true"
                             (back)="close()"
                             (next)="close()">
      </app-step-achievements>

      <app-step-skills *ngSwitchCase="'skills'"
                       [submitLabelKey]="'common.save'"
                       [showBack]="false"
                       [requireChanges]="true"
                       (back)="close()"
                       (next)="close()">
      </app-step-skills>

      <app-step-languages *ngSwitchCase="'languages'"
                          [submitLabelKey]="'common.save'"
                          [showBack]="false"
                          [requireChanges]="true"
                          (back)="close()"
                          (next)="close()">
      </app-step-languages>

      <app-step-attachments *ngSwitchCase="'attachments'"
                            [submitLabelKey]="'common.save'"
                            [showBack]="false"
                            [requireChanges]="true"
                            (back)="close()"
                            (next)="close()">
      </app-step-attachments>
    </ng-container>
  }
</div>
