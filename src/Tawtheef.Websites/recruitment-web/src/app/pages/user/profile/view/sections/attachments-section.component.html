<div class="section-body">
  @if (profile?.additionalAttachments?.length) {
    <div class="list-group list-group-flush">
      @for (att of profile?.additionalAttachments; track att.id) {
        <div class="list-group-item px-0 d-flex justify-content-between align-items-center">
          <div class="fw-semibold">{{ att.title || ('profileView.fields.attachment' | translate) }}</div>
          <button pButton type="button" class="p-button-text p-button-sm" icon="pi pi-external-link" (click)="open(att.file)"></button>
        </div>
      }
    </div>
  } @else {
    <div class="text-muted">{{ 'common.none' | translate }}</div>
  }
</div>
