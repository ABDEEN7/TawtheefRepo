<div class="p-3" i18nNamespace="pages/user/wizard-profile">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <button class="btn btn-outline-secondary" (click)="backToOverview()">رجوع للملف</button>
    <div class="fw-semibold">تعديل القسم: {{ section() }}</div>
  </div>

  @if (loading()) {
    <div class="card p-4">جاري التحميل...</div>
  } @else if (vmReady()) {

    <ng-container [ngSwitch]="section()">

      <app-step-prereq *ngSwitchCase="'prerequisites'"
                       (next)="backToOverview()">
      </app-step-prereq>

      <app-step-personal *ngSwitchCase="'personal'"
                         (back)="backToOverview()"
                         (next)="backToOverview()">
      </app-step-personal>

      <app-step-contact *ngSwitchCase="'contact'"
                        (back)="backToOverview()"
                        (next)="backToOverview()">
      </app-step-contact>

      <app-step-degrees *ngSwitchCase="'qualifications'"
                       (back)="backToOverview()"
                       (next)="backToOverview()">
      </app-step-degrees>

      <app-step-experience *ngSwitchCase="'experience'"
                           (back)="backToOverview()"
                           (next)="backToOverview()">
      </app-step-experience>

      <app-step-achievements *ngSwitchCase="'achievements'"
                             (back)="backToOverview()"
                             (next)="backToOverview()">
      </app-step-achievements>

      <app-step-skills *ngSwitchCase="'skills'"
                       (back)="backToOverview()"
                       (next)="backToOverview()">
      </app-step-skills>

      <app-step-languages *ngSwitchCase="'languages'"
                          (back)="backToOverview()"
                          (next)="backToOverview()">
      </app-step-languages>

      <app-step-attachments *ngSwitchCase="'attachments'"
                            (back)="backToOverview()"
                            (next)="backToOverview()">
      </app-step-attachments>

    </ng-container>
  }
</div>
