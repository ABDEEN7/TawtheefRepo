<div class="section-body">
  @if (profile?.trainingCourses?.length) {
    <div class="list-group list-group-flush">
      @for (course of profile?.trainingCourses; track course.id) {
        <div class="list-group-item px-0">
          <div class="fw-semibold">{{ course.title || '-' }}</div>
          <div class="text-muted small">{{ course.provider }} · {{ course.country?.name }}</div>
          <div class="text-muted small">{{ course.startDate }} - {{ course.endDate }}</div>
        </div>
      }
    </div>
  } @else {
    <div class="text-muted">{{ 'common.none' | translate }}</div>
  }
</div>
