<div class="section-body">
  @if (profile?.skills?.length) {
    <div class="d-flex flex-wrap gap-2">
      @for (skill of profile?.skills; track skill.id) {
        <span class="badge text-bg-light border">{{ skill.skill.name }} ({{ skill.level.name }})</span>
      }
    </div>
  } @else {
    <div class="text-muted">{{ 'common.none' | translate }}</div>
  }
</div>
