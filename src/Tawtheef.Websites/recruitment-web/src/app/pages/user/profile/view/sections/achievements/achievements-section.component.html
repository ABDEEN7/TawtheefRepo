<div class="section-body">
  @if (profile?.achievements?.length) {
    <div class="list-group list-group-flush">
      @for (ach of profile?.achievements; track ach.id) {
        <div class="list-group-item px-0">
          <div class="fw-semibold">{{ ach.title }}</div>
          <div class="text-muted small">{{ ach.issuingAuthority }} · {{ ach.issueDate }}</div>
          <div class="text-muted small">{{ ach.description }}</div>
        </div>
      }
    </div>
  } @else {
    <div class="text-muted">{{ 'common.none' | translate }}</div>
  }
</div>
