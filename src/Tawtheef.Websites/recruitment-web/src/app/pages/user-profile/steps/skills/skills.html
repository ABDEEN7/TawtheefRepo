<div class="card border-0 shadow rounded-4 p-4 mb-3">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">المهارات</label>
      <input class="form-control" placeholder="أدخل المهارة" [(ngModel)]="newSkill" (keyup.enter)="addSkill()">
      <div class="mt-2">
        @for (s of skills; track s) {
          <span class="badge bg-light text-dark me-1">{{ s }}</span>
        } @empty {
          <span class="text-muted small">لا توجد مهارات بعد</span>
        }
      </div>
    </div>

    <div class="col-md-6">
      <label class="form-label">اللغات</label>
      <div class="d-flex gap-2">
        <input class="form-control" placeholder="اللغة" [(ngModel)]="newLang.name">
        <select class="form-select" [(ngModel)]="newLang.level">
          <option value="" disabled selected>اختر المستوى</option>
          <option>مبتدئ</option><option>متوسط</option><option>متقدم</option><option>ممتاز</option>
        </select>
        <button class="btn btn-outline-primary" (click)="addLanguage()">+</button>
      </div>
      <ul class="mt-2 list-unstyled small">
        @for (l of languages; track l.name + l.level) {
          <li>{{ l.name }} - {{ l.level }}</li>
        } @empty {
          <li class="text-muted">لا توجد لغات بعد</li>
        }
      </ul>
    </div>
  </div>
</div>
