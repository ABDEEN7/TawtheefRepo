<div class="card border-0 shadow rounded-4 p-4 mb-3">
  <h6 class="fw-bold mb-3" style="color:var(--brand)">الخبرات</h6>
  <div class="table-responsive">
    <table class="table align-middle">
      <thead>
      <tr><th>الجهة</th><th>المسمى</th><th>الفترة</th><th></th></tr>
      </thead>
      <tbody>
        @for (exp of experiences; track exp.org + exp.title) {
          <tr>
            <td><input class="form-control" [(ngModel)]="exp.org"></td>
            <td><input class="form-control" [(ngModel)]="exp.title"></td>
            <td>
              <input class="form-control d-inline-block w-45" [(ngModel)]="exp.from" placeholder="من"> -
              <input class="form-control d-inline-block w-45" [(ngModel)]="exp.to" placeholder="إلى">
            </td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-danger" (click)="removeExperience(experiences.indexOf(exp))">حذف</button>
            </td>
          </tr>
        } @empty {
          <tr><td colspan="4" class="text-center">لا توجد خبرات</td></tr>
        }
      </tbody>
    </table>
  </div>
  <button class="btn btn-outline-primary rounded-pill mt-2" (click)="addExperience()">إضافة خبرة</button>
</div>
