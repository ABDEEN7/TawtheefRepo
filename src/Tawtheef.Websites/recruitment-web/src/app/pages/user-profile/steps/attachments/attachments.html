<div class="card border-0 shadow rounded-4 p-4 mb-3">
  <h6 class="fw-bold mb-3" style="color:var(--brand)">المرفقات</h6>
  <input type="file" (change)="onFileSelect($event)" multiple>
  <ul class="list-unstyled mt-2 small">
    @for (f of files; track f.name) {
      <li>{{ f.name }}</li>
    } @empty {
      <li class="text-muted">لم يتم اختيار ملفات</li>
    }
  </ul>
</div>
