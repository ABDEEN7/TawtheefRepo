<footer class="py-4 bg-primary text-white position-relative">
  <div class="footer-divider"></div>
  <div class="container container-narrow pt-3">
    <div class="row align-items-center">
      <!-- Right side in RTL (Copyright & Ministry) -->
      <div class="col-md-4 text-center text-md-start mb-3 mb-md-0 small">
        <div class="d-flex flex-column align-items-center align-items-md-start">
          <div class="fw-semibold">{{ 'public.footer.ministry' | translate: { year: getCurrentYear() } }}</div>
          <div class="text-white-50 mt-1">{{ 'public.footer.rights' | translate: { year: getCurrentYear() } }}</div>
        </div>
      </div>

      <!-- Center (Social Media) -->
      <div class="col-md-4 text-center mb-3 mb-md-0">
        <div class="d-flex justify-content-center gap-3 social-links">
          <a href="https://www.linkedin.com/company/qatar_edu" class="social-icon">
            <img src="assets/img/social-media/linkedin.svg" alt="LinkedIn" width="18" height="18">
          </a>
          <a href="https://www.youtube.com/c/eduqatar" class="social-icon">
            <img src="assets/img/social-media/youtube.svg" alt="YouTube" width="18" height="18">
          </a>
          <a href="https://x.com/qatar_edu" class="social-icon">
            <img src="assets/img/social-media/twitter-x.svg" alt="X" width="18" height="18">
          </a>
          <a href="https://www.facebook.com/qatar.edu" class="social-icon">
            <img src="assets/img/social-media/facebook.png" alt="Facebook" width="18" height="18">
          </a>
        </div>
      </div>

      <!-- Left side in RTL (Links) -->
      <div class="col-md-4 text-center text-md-end">
        <div class="footer-links">
          <a routerLink="/privacy" class="text-white text-decoration-none me-4">{{ 'internal.footer.privacy' | translate
            }}</a>
          <a routerLink="/terms" class="text-white text-decoration-none">{{ 'internal.footer.terms' | translate }}</a>
        </div>
      </div>
    </div>
  </div>
</footer>
