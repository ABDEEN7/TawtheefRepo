trigger: none

pr:
  branches:
    include:
      - "*"

pool:
  vmImage: "ubuntu-latest"

stages:

# =========================
# Stage 1: Detect changes
# =========================
- stage: detect_changes_stage
  displayName: Detect Changes
  jobs:
  - job: detect
    displayName: Detect changed files
    steps:
    - checkout: self
      persistCredentials: true

    - bash: |
        set -eo pipefail

        TARGET_BRANCH="${SYSTEM_PULLREQUEST_TARGETBRANCH:-origin/Development}"
        git fetch origin "$TARGET_BRANCH":target || true

        FILES=$(git diff --name-only target HEAD || true)

        echo "Changed Files:"
        echo "$FILES"

        OPS_REGEX="^src/Tawtheef.Websites/operations-web/"
        REC_REGEX="^src/Tawtheef.Websites/recruitment-web/"
        BACK_REGEX="^src/(Application|Domain|Infrastructure|Tawtheef.APIs)/"

        # ops
        if echo "$FILES" | grep -qE "$OPS_REGEX"; then
          echo "##vso[task.setvariable variable=opsChanged;isOutput=true]true"
        else
          echo "##vso[task.setvariable variable=opsChanged;isOutput=true]false"
        fi

        # rec
        if echo "$FILES" | grep -qE "$REC_REGEX"; then
          echo "##vso[task.setvariable variable=recChanged;isOutput=true]true"
        else
          echo "##vso[task.setvariable variable=recChanged;isOutput=true]false"
        fi

        # backend
        if echo "$FILES" | grep -qE "$BACK_REGEX"; then
          echo "##vso[task.setvariable variable=backendChanged;isOutput=true]true"
        else
          echo "##vso[task.setvariable variable=backendChanged;isOutput=true]false"
        fi
      name: detectChanges

  # Debug job that runs after the "detect" job and prints the dependency outputs
  - job: debugOutputs
    displayName: Debug show dependency outputs and evaluated values
    dependsOn: detect
    steps:
    - bash: |
        set -eo pipefail

        echo "----- Literal expressions (for reference) -----"
        echo "dependencies.detect_changes_stage.detect.outputs['detectChanges.opsChanged']"
        echo "dependencies.detect_changes_stage.detect.outputs['detectChanges.recChanged']"
        echo "dependencies.detect_changes_stage.detect.outputs['detectChanges.backendChanged']"
        echo
        echo "----- Evaluated via runtime expressions (env vars) -----"
        echo "opsChanged (env): $OPS"
        echo "recChanged (env): $REC"
        echo "backendChanged (env): $BACK"
        echo
        echo "----- Full filtered environment (helpful to see how values are exposed on the agent) -----"
        printenv | sort | grep -i -E 'ops|rec|back|detect|dependencies' || true

        echo
        echo "----- Also print the step output file presence (detect step name = detectChanges) -----"
        # This prints any output files produced in the job workdir; helpful for advanced debugging
        find $(Agent.TempDirectory) -maxdepth 2 -type f -print || true
      displayName: Print dependency outputs and env
      env:
        OPS: $[ dependencies.detect_changes_stage.detect.outputs['detectChanges.opsChanged'] ]
        REC: $[ dependencies.detect_changes_stage.detect.outputs['detectChanges.recChanged'] ]
        BACK: $[ dependencies.detect_changes_stage.detect.outputs['detectChanges.backendChanged'] ]


# =========================
# Stage 2: Build Frontend
# =========================
- stage: frontends_stage
  displayName: Build Frontends
  dependsOn: detect_changes_stage
  condition: or(
    eq(dependencies.detect_changes_stage.detect.outputs['detectChanges.opsChanged'], 'true'),
    eq(dependencies.detect_changes_stage.detect.outputs['detectChanges.recChanged'], 'true'))
  jobs:

  # ----- operations-web -----
  - job: buildOperations
    displayName: Build operations-web
    condition: eq(dependencies.detect_changes_stage.detect.outputs['detectChanges.opsChanged'], 'true')
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - task: Cache@2
      inputs:
        key: 'npm | operations | src/Tawtheef.Websites/operations-web/package-lock.json'
        path: src/Tawtheef.Websites/operations-web/node_modules

    - script: |
        cd src/Tawtheef.Websites/operations-web
        npm ci --no-audit
        npm run build
      displayName: Build operations-web

  # ----- recruitment-web -----
  - job: buildRecruitment
    displayName: Build recruitment-web
    condition: eq(dependencies.detect_changes_stage.detect.outputs['detectChanges.recChanged'], 'true')
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - task: Cache@2
      inputs:
        key: 'npm | recruitment | src/Tawtheef.Websites/recruitment-web/package-lock.json'
        path: src/Tawtheef.Websites/recruitment-web/node_modules

    - script: |
        cd src/Tawtheef.Websites/recruitment-web
        npm ci --no-audit
        npm run build
      displayName: Build recruitment-web


# =========================
# Stage 3: Build Backend
# =========================
- stage: backend_stage
  displayName: Build Backend
  dependsOn: detect_changes_stage
  condition: eq(dependencies.detect_changes_stage.detect.outputs['detectChanges.backendChanged'], 'true')
  jobs:
  - job: buildBackend
    displayName: Build .NET backend
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: Cache@2
      inputs:
        key: 'nuget | src/**/packages.lock.json'
        path: ~/.nuget/packages

    - script: |
        cd src
        dotnet restore
        dotnet build --configuration Release --no-restore
      displayName: Build backend


# =========================
# Stage 4: PR Comment
# =========================
- stage: PostComment
  displayName: Post PR Summary
  dependsOn:
    - detect_changes_stage
    - frontends_stage
    - backend_stage
  condition: always()
  jobs:
  - job: postComment
    displayName: Post summary comment
    steps:
    - checkout: self

    - bash: |
        # Read evaluated outputs (these are expanded by the runtime into literal 'true'/'false')
        OPS=$(dependencies.detect_changes_stage.detect.outputs['detectChanges.opsChanged'])
        REC=$(dependencies.detect_changes_stage.detect.outputs['detectChanges.recChanged'])
        BACK=$(dependencies.detect_changes_stage.detect.outputs['detectChanges.backendChanged'])

        echo "Operations: $OPS"
        echo "Recruitment: $REC"
        echo "Backend: $BACK"

        PR_ID="$SYSTEM_PULLREQUEST_PULLREQUESTID"
        if [ -z "$PR_ID" ]; then
          echo "Not a PR run."
          exit 0
        fi

        BODY="{
          \"comments\": [
            {
              \"content\": \"**PR Build Summary**\n\n- operations-web: $OPS\n- recruitment-web: $REC\n- backend: $BACK\n\",
              \"commentType\": 1
            }
          ]
        }"

        API_URL="${SYSTEM_TEAMFOUNDATIONCOLLECTIONURI}${SYSTEM_TEAMPROJECT}/_apis/git/repositories/${BUILD_REPOSITORY_ID}/pullRequests/${PR_ID}/threads?api-version=6.0"

        curl -sS -H "Content-Type: application/json" \
             -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
             --data "$BODY" \
             "$API_URL" || echo "Failed to post comment"
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      displayName: Post PR comment