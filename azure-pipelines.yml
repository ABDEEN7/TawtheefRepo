trigger: none

pr:
  branches:
    include:
      - "*"

pool:
  vmImage: "ubuntu-latest"

stages:

# =========================
# Stage 1: Detect changes
# =========================
- stage: Detect
  displayName: Detect Changes
  jobs:
  - job: detect
    displayName: Detect changed files
    steps:
    - checkout: self
      persistCredentials: true

    - bash: |
        set -eo pipefail

        TARGET_BRANCH="${SYSTEM_PULLREQUEST_TARGETBRANCH:-origin/main}"
        echo "Target branch: $TARGET_BRANCH"
        
        # Fetch the target branch
        git fetch origin "$TARGET_BRANCH" --depth=1
        
        # Get the current branch (for PR it's the source branch)
        CURRENT_BRANCH="${SYSTEM_PULLREQUEST_SOURCEBRANCH:-$(git branch --show-current)}"
        echo "Current branch: $CURRENT_BRANCH"
        
        # Compare with the target branch
        FILES=$(git diff --name-only "origin/$TARGET_BRANCH" HEAD 2>/dev/null || git diff --name-only "target" HEAD 2>/dev/null || echo "")
        
        echo "Changed Files:"
        echo "$FILES"
        echo "----------------------------------------"

        OPS_REGEX="^src/Tawtheef.Websites/operations-web/"
        REC_REGEX="^src/Tawtheef.Websites/recruitment-web/"
        BACK_REGEX="^src/(Application|Domain|Infrastructure|Tawtheef.APIs)/"

        # Initialize variables
        OPS_CHANGED="false"
        REC_CHANGED="false"  
        BACKEND_CHANGED="false"

        # ops
        if echo "$FILES" | grep -qE "$OPS_REGEX"; then
          echo "Operations-web changes detected"
          OPS_CHANGED="true"
        fi

        # rec
        if echo "$FILES" | grep -qE "$REC_REGEX"; then
          echo "Recruitment-web changes detected"
          REC_CHANGED="true"
        fi

        # backend
        if echo "$FILES" | grep -qE "$BACK_REGEX"; then
          echo "Backend changes detected"
          BACKEND_CHANGED="true"
        fi

        echo "##vso[task.setvariable variable=opsChanged;isOutput=true]$OPS_CHANGED"
        echo "##vso[task.setvariable variable=recChanged;isOutput=true]$REC_CHANGED"
        echo "##vso[task.setvariable variable=backendChanged;isOutput=true]$BACKEND_CHANGED"
        
        echo "Summary:"
        echo "Operations changed: $OPS_CHANGED"
        echo "Recruitment changed: $REC_CHANGED"
        echo "Backend changed: $BACKEND_CHANGED"
      name: detectChanges

# =========================
# Stage 2: Build Frontend
# =========================
- stage: Frontends
  displayName: Build Frontends
  dependsOn: Detect
  condition: or(eq(stageDependencies.Detect.detect.outputs['detectChanges.opsChanged'], 'true'),
                eq(stageDependencies.Detect.detect.outputs['detectChanges.recChanged'], 'true'))
  jobs:

  # ----- operations-web -----
  - job: buildOperations
    displayName: Build operations-web
    condition: eq(stageDependencies.Detect.detect.outputs['detectChanges.opsChanged'], 'true')
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - task: Cache@2
      inputs:
        key: 'npm | operations | src/Tawtheef.Websites/operations-web/package-lock.json'
        path: src/Tawtheef.Websites/operations-web/node_modules

    - script: |
        cd src/Tawtheef.Websites/operations-web
        npm ci --no-audit
        npm run build
      displayName: Build operations-web

  # ----- recruitment-web -----
  - job: buildRecruitment
    displayName: Build recruitment-web
    condition: eq(stageDependencies.Detect.detect.outputs['detectChanges.recChanged'], 'true')
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'

    - task: Cache@2
      inputs:
        key: 'npm | recruitment | src/Tawtheef.Websites/recruitment-web/package-lock.json'
        path: src/Tawtheef.Websites/recruitment-web/node_modules

    - script: |
        cd src/Tawtheef.Websites/recruitment-web
        npm ci --no-audit
        npm run build
      displayName: Build recruitment-web


# =========================
# Stage 3: Build Backend
# =========================
- stage: Backend
  displayName: Build Backend
  dependsOn: Detect
  condition: eq(stageDependencies.Detect.detect.outputs['detectChanges.backendChanged'], 'true')
  jobs:
  - job: buildBackend
    displayName: Build .NET backend
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: Cache@2
      inputs:
        key: 'nuget | src/**/packages.lock.json'
        path: ~/.nuget/packages

    - script: |
        cd src
        dotnet restore
        dotnet build --configuration Release --no-restore
      displayName: Build backend


# =========================
# Stage 4: PR Comment
# =========================
- stage: PostComment
  displayName: Post PR Summary
  dependsOn:
    - Detect
    - Frontends
    - Backend
  condition: always()
  jobs:
  - job: postComment
    displayName: Post summary comment
    steps:
    - checkout: self

    - bash: |
        OPS_CHANGED=$(stageDependencies.Detect.detect.outputs['detectChanges.opsChanged'])
        REC_CHANGED=$(stageDependencies.Detect.detect.outputs['detectChanges.recChanged'])
        BACK_CHANGED=$(stageDependencies.Detect.detect.outputs['detectChanges.backendChanged'])

        echo "Operations: $OPS_CHANGED"
        echo "Recruitment: $REC_CHANGED"
        echo "Backend: $BACK_CHANGED"

        PR_ID="$SYSTEM_PULLREQUEST_PULLREQUESTID"
        if [ -z "$PR_ID" ]; then
          echo "Not a PR run."
          exit 0
        fi

        BODY="{
          \"comments\": [
            {
              \"content\": \"**PR Build Summary**\n\n- operations-web: $OPS_CHANGED\n- recruitment-web: $REC_CHANGED\n- backend: $BACK_CHANGED\n\",
              \"commentType\": 1
            }
          ]
        }"

        API_URL="${SYSTEM_TEAMFOUNDATIONCOLLECTIONURI}${SYSTEM_TEAMPROJECT}/_apis/git/repositories/${BUILD_REPOSITORY_ID}/pullRequests/${PR_ID}/threads?api-version=6.0"

        curl -sS -H "Content-Type: application/json" \
             -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
             --data "$BODY" \
             "$API_URL" || echo "Failed to post comment"
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      displayName: Post PR comment