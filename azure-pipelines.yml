trigger:
  branches:
    include:
      - Development
  tags:
    include:
      - stage-*
      - prod-*

pr:
  branches:
    include:
      - "*"

variables:
  buildConfiguration: Release
  apiProject: src/Tawtheef.APIs/Operations.API/Operations.API.csproj
  efMigrationsProject: src/Infrastructure/Infrastructure.csproj
  efStartupProject: src/Tawtheef.APIs/Operations.API/Operations.API.csproj
  azureServiceConnection: AzureServiceConnection
  stageAppServiceName: tawtheef-stage-api
  prodAppServiceName: tawtheef-prod-api

pool:
  vmImage: "ubuntu-latest"

stages:
  
  # =========================
  # Stage 1: Detect changes
  # =========================
  - stage: detect_changes_stage
    displayName: Detect Changes
    condition: eq(variables['Build.Reason'], 'PullRequest')
    jobs:
      - job: detect
        displayName: Detect changed files
        variables:
          # Initialize variables with default values
          opsChanged: 'false'
          recChanged: 'false'
          backendChanged: 'false'
        steps:
          - checkout: self
            persistCredentials: true

          - bash: |
              set -eo pipefail
              
              TARGET_BRANCH="${SYSTEM_PULLREQUEST_TARGETBRANCH:-origin/Development}"
              echo "Target branch: $TARGET_BRANCH"
              git fetch origin "$TARGET_BRANCH":target || true
              
              FILES=$(git diff --name-only target HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
              echo "Changed Files:"
              echo "$FILES"
              echo "---"
              
              OPS_REGEX="^src/Tawtheef.Websites/operations-web/"
              REC_REGEX="^src/Tawtheef.Websites/recruitment-web/"
              BACK_REGEX="^src/(Application|Domain|Infrastructure|Tawtheef.APIs)/"
              
              # ops
              if echo "$FILES" | grep -qE "$OPS_REGEX"; then
                echo "##vso[task.setvariable variable=opsChanged;isOutput=true]true"
                echo "Operations web changes detected"
              else
                echo "##vso[task.setvariable variable=opsChanged;isOutput=true]false"
                echo "No operations web changes"
              fi
              
              # rec
              if echo "$FILES" | grep -qE "$REC_REGEX"; then
                echo "##vso[task.setvariable variable=recChanged;isOutput=true]true"
                echo "Recruitment web changes detected"
              else
                echo "##vso[task.setvariable variable=recChanged;isOutput=true]false"
                echo "No recruitment web changes"
              fi
              
              # backend
              if echo "$FILES" | grep -qE "$BACK_REGEX"; then
                echo "##vso[task.setvariable variable=backendChanged;isOutput=true]true"
                echo "Backend changes detected"
              else
                echo "##vso[task.setvariable variable=backendChanged;isOutput=true]false"
                echo "No backend changes"
              fi
            name: detectChanges
          
          # Debug step to verify outputs are set
          - bash: |
              echo "Current job outputs:"
              echo "opsChanged: $(opsChanged)"
              echo "recChanged: $(recChanged)"
              echo "backendChanged: $(backendChanged)"
            displayName: Verify outputs in same job
  
  
  # =========================
  # Stage 2: Build Frontend - USING CONDITIONAL STAGE EXECUTION
  # =========================
  - stage: frontends_stage
    displayName: Build Frontends
    dependsOn: detect_changes_stage
    # Condition will be evaluated at runtime
    condition: |
      and(
        eq(variables['Build.Reason'], 'PullRequest'),
        or(
          eq(stageDependencies.detect_changes_stage.outputs['detect.detectChanges.opsChanged'], 'true'),
          eq(stageDependencies.detect_changes_stage.outputs['detect.detectChanges.recChanged'], 'true')
        )
      )
    jobs:
      - job: buildOperations
        displayName: Build operations-web
        condition: eq(stageDependencies.detect_changes_stage.detect.outputs['detectChanges.opsChanged'], 'true')
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - script: |
              echo "Building operations-web..."              
              cd src/Tawtheef.Websites/operations-web

              echo "📦 Installing npm dependencies (recruitment-web)..."
              if [ -f package-lock.json ]; then
                echo "Using npm ci..."
                npm ci
              else
                echo "No package-lock.json found, using npm install..."
                npm install
              fi

              # echo "🔍 Running lint..."
              # npm run lint

              echo "🏗️ Building operations-web..."
              npm run build --configuration=production
            displayName: Build operations-web

      - job: buildRecruitment
        displayName: Build recruitment-web
        condition: eq(stageDependencies.detect_changes_stage.detect.outputs['detectChanges.recChanged'], 'true')
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - script: |
              echo "Building recruitment-web..."              
              cd src/Tawtheef.Websites/recruitment-web

              echo "📦 Installing npm dependencies (recruitment-web)..."
              if [ -f package-lock.json ]; then
                echo "Using npm ci..."
                npm ci
              else
                echo "No package-lock.json found, using npm install..."
                npm install
              fi

              # echo "🔍 Running lint..."
              # npm run lint

              echo "🏗️ Building recruitment-web..."
              npm run build --configuration=production
            displayName: Build recruitment-web
  
  
  # =========================
  # Stage 3: Build Backend - USING CONDITIONAL STAGE EXECUTION
  # =========================
  - stage: backend_stage
    displayName: Build Backend
    dependsOn: detect_changes_stage
    condition: |
      and(
        eq(variables['Build.Reason'], 'PullRequest'),
        eq(stageDependencies.detect_changes_stage.outputs['detect.detectChanges.backendChanged'], 'true')
      )
    jobs:
      - job: buildBackend
        displayName: Build .NET backend
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '10.x'
          - script: |
              echo "Building backend..."
              echo "📦 Restoring .NET solution..."
              dotnet restore Tawtheef.sln
  
              echo "🏗️ Building backend in Release mode..."
              dotnet build Tawtheef.sln -c Release --no-restore
            displayName: Build backend
  
  
  # =========================
  # Stage 4: PR Comment - USING VARIABLES APPROACH
  # =========================
  - stage: PostComment
    displayName: Post PR Summary
    dependsOn:
      - detect_changes_stage
      - frontends_stage
      - backend_stage
    condition: and(always(), eq(variables['Build.Reason'], 'PullRequest'))
    variables:
      OPS: $[ stageDependencies.detect_changes_stage.outputs['detect.detectChanges.opsChanged'] ]
      REC: $[ stageDependencies.detect_changes_stage.outputs['detect.detectChanges.recChanged'] ]
      BACK: $[ stageDependencies.detect_changes_stage.outputs['detect.detectChanges.backendChanged'] ]
    jobs:
      - job: postComment
        displayName: Post summary comment
        steps:
          - checkout: none
          - bash: |
              echo "PR Build Summary:"
              echo "- Operations: $(OPS)"
              echo "- Recruitment: $(REC)" 
              echo "- Backend: $(BACK)"
              
              # For actual PR comment, you would use the REST API here
              echo "##vso[task.complete result=Succeeded;]PR summary logged"
            displayName: Log PR summary


  # =========================
  # Stage 5: CI Build & Publish (Development branch + tags)
  # =========================
  - stage: build_publish_stage
    displayName: Build & Publish API
    condition: ne(variables['Build.Reason'], 'PullRequest')
    jobs:
      - job: build_api
        displayName: Build API
        steps:
          - checkout: self
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '10.x'
          - script: |
              set -euo pipefail
              dotnet restore Tawtheef.sln
            displayName: Restore solution
          - script: |
              set -euo pipefail
              dotnet build Tawtheef.sln -c $(buildConfiguration) --no-restore
            displayName: Build solution
          - script: |
              set -euo pipefail
              dotnet publish $(apiProject) -c $(buildConfiguration) --no-build -o $(Build.ArtifactStagingDirectory)/publish
            displayName: Publish API
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/publish
              ArtifactName: drop
              publishLocation: Container


  # =========================
  # Stage 6: Deploy to Stage (tag: stage-*)
  # =========================
  - stage: deploy_stage
    displayName: Deploy to Stage
    dependsOn: build_publish_stage
    condition: |
      and(
        succeeded(),
        startsWith(variables['Build.SourceBranch'], 'refs/tags/stage-')
      )
    jobs:
      - job: deploy_stage_api
        displayName: Migrate & Deploy Stage
        steps:
          - download: current
            artifact: drop
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '10.x'
          - script: |
              set -euo pipefail
              dotnet tool install -g dotnet-ef
              export PATH="$PATH:$HOME/.dotnet/tools"
              dotnet ef database update --project $(efMigrationsProject) --startup-project $(efStartupProject)
            displayName: Run EF migrations (Stage)
            env:
              ConnectionStrings__DefaultConnection: $(StageDbConnectionString)
          - task: AzureWebApp@1
            inputs:
              azureSubscription: $(azureServiceConnection)
              appName: $(stageAppServiceName)
              package: $(Pipeline.Workspace)/drop


  # =========================
  # Stage 7: Deploy to Production (tag: prod-*)
  # =========================
  - stage: deploy_production
    displayName: Deploy to Production
    dependsOn: build_publish_stage
    condition: |
      and(
        succeeded(),
        startsWith(variables['Build.SourceBranch'], 'refs/tags/prod-')
      )
    jobs:
      - job: deploy_prod_api
        displayName: Migrate & Deploy Production
        steps:
          - download: current
            artifact: drop
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '10.x'
          - script: |
              set -euo pipefail
              dotnet tool install -g dotnet-ef
              export PATH="$PATH:$HOME/.dotnet/tools"
              dotnet ef database update --project $(efMigrationsProject) --startup-project $(efStartupProject)
            displayName: Run EF migrations (Production)
            env:
              ConnectionStrings__DefaultConnection: $(ProdDbConnectionString)
          - task: AzureWebApp@1
            inputs:
              azureSubscription: $(azureServiceConnection)
              appName: $(prodAppServiceName)
              package: $(Pipeline.Workspace)/drop
